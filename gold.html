<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إيموشا جولد | جاري التحويل</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: #ffd700; text-align: center; padding-top: 100px; }
        .box { border: 2px solid #ffd700; display: inline-block; padding: 20px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>إيموشا جولد - EMOSHA GOLD</h2>
        <p id="msg">جاري توجيهك الآن...</p>
    </div>

    <script>
        const config = {
            apiKey: "AIzaSyCp-m2DkIIWiokUeuntHLvDbEclB6P_yXg",
            databaseURL: "https://shrouk-ehab-default-rtdb.firebaseio.com/",
            projectId: "shrouk-ehab",
            appId: "1:1015714183835:web:3d5e2b0f60e781e3f7643e"
        };
        firebase.initializeApp(config);

        // تعديل جذري: الكود سيبحث عن today أولاً، وإذا لم يجدها سيظل في الصفحة
        firebase.database().ref('gold/today').on('value', (snapshot) => {
            const link = snapshot.val();
            if (link && link.startsWith('http')) {
                window.location.replace(link);
            } else {
                document.getElementById('msg').innerHTML = "في انتظار تحديث الرابط من فايربيز...";
            }
        }, (error) => {
            document.getElementById('msg').innerHTML = "تأكد من فتح الـ Rules في فايربيز";
        });
    </script>
</body>
</html>
