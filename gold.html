<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إيموشا جولد | جاري التحويل</title>
    <!-- مكتبة فايربيز المختصرة -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: #ffd700; text-align: center; padding-top: 100px; }
        .box { border: 2px solid #ffd700; display: inline-block; padding: 20px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>إيموشا جولد - EMOSHA GOLD</h2>
        <p id="msg">انتظر ثواني...</p>
    </div>

    <script>
        // --- البيانات الحقيقية من صورتك يا قبطان ---
        const firebaseConfig = {
            apiKey: "AIzaSyCp-m2DkIIWiokUeuntHLvDbEclB6P_yXg",
            databaseURL: "https://shrouk-ehab-default-rtdb.firebaseio.com/",
            projectId: "shrouk-ehab",
            appId: "1:1015714183835:web:3d5e2b0f60e781e3f7643e"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }

        const params = new URLSearchParams(window.location.search);
        const myId = params.get('id');

        if (myId) {
            // البحث في مجلد gold اللي عملناه في فايربيز
            firebase.database().ref('gold/' + myId).on('value', (s) => {
                const url = s.val();
                if (url) {
                    window.location.replace(url);
                } else {
                    document.getElementById('msg').innerHTML = "الرابط غير موجود في قاعدة البيانات";
                }
            });
        } else {
            // لو مفيش id في الرابط، يرجع للموقع الرئيسي
            window.location.replace("https://shrouk-two.vercel.app/");
        }
    </script>
</body>
</html>
