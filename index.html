<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شروق الذهب - إيموشا</title>
    <style>
        /* تصميم أسود ملكي بلمسة ذهبية */
        body {
            background: radial-gradient(circle at top, #1a1a1a 0%, #000000 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* عنوان شروق الذهب - توهج احترافي */
        .header-section {
            text-align: center;
            padding: 50px 20px;
        }
        .main-title {
            font-size: 65px;
            font-weight: 900;
            background: linear-gradient(to bottom, #fff3a0 0%, #f1c40f 50%, #b8860b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(241, 196, 15, 0.6));
            margin: 0;
            text-transform: uppercase;
        }
        .sub-title { color: #888; font-size: 16px; margin-top: 10px; letter-spacing: 2px; }

        .container { max-width: 1100px; margin: auto; padding: 20px; }

        /* بطاقات الأسعار - زجاجية احترافية */
        .price-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .price-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(241, 196, 15, 0.3);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: 0.4s;
        }
        .price-card:hover {
            border-color: #f1c40f;
            transform: translateY(-10px);
            background: rgba(241, 196, 15, 0.05);
        }
        .price-card h3 { color: #ccc; font-size: 14px; margin-bottom: 15px; text-transform: uppercase; }
        .price-card .price { color: #f1c40f; font-size: 40px; font-weight: bold; }
        .price-card .currency { font-size: 12px; color: #666; display: block; margin-top: 5px; }

        /* المؤشر العالمي */
        .chart-container {
            border-radius: 25px;
            overflow: hidden;
            border: 1px solid #333;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            height: 500px;
        }
    </style>
</head>
<body>

    <div class="header-section">
        <h1 class="main-title">شروق الذهب</h1>
        <p class="sub-title">EMOSHA ECONOMY GATEWAY</p>
    </div>

    <div class="container">
        <div class="price-grid">
            <div class="price-card">
                <h3>عيار 24</h3>
                <div class="price" id="g24">...</div>
                <span class="currency">جنيه مصري / جرام</span>
            </div>
            <div class="price-card">
                <h3>عيار 21</h3>
                <div class="price" id="g21">...</div>
                <span class="currency">جنيه مصري / جرام</span>
            </div>
            <div class="price-card">
                <h3>عيار 18</h3>
                <div class="price" id="g18">...</div>
                <span class="currency">جنيه مصري / جرام</span>
            </div>
            <div class="price-card">
                <h3>الأونصة العالمية</h3>
                <div class="price" id="gxau">...</div>
                <span class="currency">دولار أمريكي</span>
            </div>
        </div>

        <div class="chart-container">
            <div id="tv_chart" style="height:100%; width:100%;"></div>
        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        // تفعيل المؤشر
        new TradingView.widget({
            "autosize": true, "symbol": "OANDA:XAUUSD", "interval": "1", "theme": "dark", "style": "1", "locale": "ar", "container_id": "tv_chart"
        });

        // جلب السعر الحقيقي الآن
        async function updateLivePrices() {
            try {
                const response = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT');
                const data = await response.json();
                const globalOunce = parseFloat(data.price);
                
                // --- اضبط سعر الدولار هنا يدوياً لضمان دقة السعر في مصر ---
                const usdRate = 48.30; 
                // -------------------------------------------------------

                document.getElementById('gxau').innerText = globalOunce.toFixed(0) + "$";
                
                const gram24 = (globalOunce / 31.1035) * usdRate;
                document.getElementById('g24').innerText = Math.round(gram24).toLocaleString();
                document.getElementById('g21').innerText = Math.round(gram24 * 0.875).toLocaleString();
                document.getElementById('g18').innerText = Math.round(gram24 * 0.75).toLocaleString();

            } catch (error) {
                console.error("خطأ في جلب البيانات");
            }
        }

        updateLivePrices();
        setInterval(updateLivePrices, 30000); // تحديث كل 30 ثانية
    </script>
</body>
</html>
