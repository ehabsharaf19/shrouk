<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شروق الذهب - Emosha</title>
    <style>
        :root { --gold: #f1c40f; --dark-bg: #0a0a0a; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--dark-bg); color: white; margin: 0; padding: 0; }
        
        /* الهيدر الاحترافي */
        header { text-align: center; padding: 40px 20px; border-bottom: 2px solid var(--gold); background: linear-gradient(to bottom, #1a1a1a, var(--dark-bg)); }
        .logo-text { color: var(--gold); font-size: 45px; font-weight: bold; text-shadow: 2px 2px 10px rgba(241, 196, 15, 0.5); margin-bottom: 10px; }
        .sub-text { color: #ccc; font-size: 18px; letter-spacing: 1px; }

        .container { max-width: 1200px; margin: auto; padding: 20px; }

        /* لوحة الأسعار المباشرة */
        .price-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .price-card { background: #1a1a1a; border: 1px solid #333; padding: 20px; border-radius: 15px; text-align: center; transition: 0.3s; border-top: 4px solid var(--gold); }
        .price-card:hover { transform: translateY(-5px); border-color: white; }
        .price-card h3 { color: #888; margin: 0; font-size: 16px; }
        .price-card .price { color: var(--gold); font-size: 28px; font-weight: bold; margin: 10px 0; }
        .price-card .unit { font-size: 14px; color: #666; }

        /* المؤشر العالمي */
        .chart-section { background: #1a1a1a; padding: 10px; border-radius: 15px; border: 1px solid #333; height: 500px; overflow: hidden; margin-bottom: 30px; }
        
        footer { text-align: center; padding: 30px; color: #555; border-top: 1px solid #222; }
    </style>
</head>
<body>

    <header>
        <div class="logo-text">شروق الذهب</div>
        <div class="sub-text">تحديثات الذهب والتحليلات الاقتصادية لحظة بلحظة</div>
    </header>

    <div class="container">
        
        <div class="price-grid">
            <div class="price-card">
                <h3>عيار 24</h3>
                <div class="price" id="gold24">...</div>
                <div class="unit">جنيه مصري / جرام</div>
            </div>
            <div class="price-card">
                <h3>عيار 21</h3>
                <div class="price" id="gold21">...</div>
                <div class="unit">جنيه مصري / جرام</div>
            </div>
            <div class="price-card">
                <h3>عيار 18</h3>
                <div class="price" id="gold18">...</div>
                <div class="unit">جنيه مصري / جرام</div>
            </div>
            <div class="price-card">
                <h3>الأونصة العالمية</h3>
                <div class="price" id="goldXAU">...</div>
                <div class="unit">دولار أمريكي</div>
            </div>
        </div>

        <div class="chart-section">
            <div id="tradingview_chart" style="height:100%; width:100%;"></div>
        </div>

    </div>

    <footer>
        تطوير إيهاب شرف - جميع الحقوق محفوظة لـ Emosha &copy; 2026
    </footer>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        // تفعيل الرسم البياني العالمي
        new TradingView.widget({
            "autosize": true,
            "symbol": "OANDA:XAUUSD",
            "interval": "H",
            "timezone": "Africa/Cairo",
            "theme": "dark",
            "style": "1",
            "locale": "ar",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "container_id": "tradingview_chart"
        });

        // دالة لجلب الأسعار وتحديثها (محاكاة الربط المباشر حالياً لضمان الشكل)
        // لتفعيل السعر الحقيقي بدقة 100% سنربطه بـ API في الخطوة التالية
        function fetchPrices() {
            // سنضع أسعار تقريبية الآن لتشاهد التصميم الاحترافي
            document.getElementById('gold24').innerText = "4,200";
            document.getElementById('gold21').innerText = "3,675";
            document.getElementById('gold18').innerText = "3,150";
            document.getElementById('goldXAU').innerText = "2,350$";
        }
        fetchPrices();
    </script>
</body>
</html>
