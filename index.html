<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شروق الذهب - EMOSHA Gold</title>
    <style>
        /* التنسيقات الأصلية الخاصة بك كما هي */
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .main-title { font-size: 50px; font-weight: bold; color: #f1c40f; text-shadow: 0 0 20px rgba(241, 196, 15, 0.7); margin-top: 20px; }
        .gateway-text { color: #666; font-size: 14px; letter-spacing: 3px; margin-bottom: 20px; }
        
        .ticker-wrap { width: 100%; background: #f1c40f; color: #000; padding: 12px 0; overflow: hidden; white-space: nowrap; font-weight: bold; font-size: 17px; margin-bottom: 25px; border-bottom: 2px solid #fff; }
        .ticker-move { display: inline-block; animation: ticker 150s linear infinite; padding-left: 100%; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* تنسيق الصفحات والتحكم في ظهورها */
        .page-section { display: none; width: 100%; min-height: 100vh; padding-bottom: 120px; }
        .active-page { display: block !important; }

        /* بار التنقل السفلي */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 15px 0; border-top: 2px solid #f1c40f; z-index: 99999; box-shadow: 0 -5px 15px rgba(0,0,0,0.5); }
        .nav-item { color: #888; text-align: center; font-size: 12px; cursor: pointer; flex: 1; transition: 0.3s; }
        .nav-item.active { color: #f1c40f; font-weight: bold; }

        /* تنسيق الكروت كما في كودك */
        .gold-card { background: #111; border: 1px solid #333; border-radius: 15px; padding: 20px; margin-bottom: 15px; text-align: center; position: relative; }
        .card-price { color: #f1c40f; font-size: 42px; font-weight: 900; }
        .bullion-box { background: #1a1a1a; border: 1px solid #333; border-radius: 15px; padding: 20px; margin: 15px; text-align: center; }
        .company-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .company-btn { background: #222; color: #fff; padding: 12px; border-radius: 8px; border: 1px solid #333; cursor: pointer; font-size: 12px; }
        .input-style { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; text-align: center; }
        
        /* إخفاء الإدارة افتراضياً */
        #admin-panel-emosha { display: none; width: 90%; max-width: 450px; margin: 20px auto; background: #1a1a1a; padding: 25px; border-radius: 15px; border: 2px solid #f1c40f; }
    </style>
</head>
<body>

<!-- 1. الصفحة الرئيسية (الافتراضية) -->
<div id="home-page" class="page-section active-page">
    <div class="main-title">شروق الذهب</div>
    <div class="gateway-text">EMOSHA GOLD</div>
    <div class="ticker-wrap"><div class="ticker-move" id="news-ticker">بإشراف القبطان إيهاب شرف.. جاري تحميل الأسعار...</div></div>
    
    <div style="width: 90%; max-width: 450px; margin: 0 auto;">
        <div class="gold-card"><span>عيار 24</span><br><span class="card-price" id="p24">0</span></div>
        <div class="gold-card"><span>عيار 21</span><br><span class="card-price" id="p21">0</span></div>
        <div class="gold-card"><span>عيار 18</span><br><span class="card-price" id="p18">0</span></div>
    </div>
    
    <div id="posts-container" style="padding: 20px;"></div>
</div>

<!-- 2. صفحة السبائك -->
<div id="bullion-page" class="page-section">
    <div class="main-title" style="font-size: 25px; text-align:center;">🏆 أسعار السبائك</div>
    <div class="bullion-box">
        <select id="b-weight" class="input-style">
            <option value="1">1 جرام</option>
            <option value="10">10 جرام</option>
            <option value="31.1">أونصة</option>
            <option value="100">100 جرام</option>
        </select>
        <div class="company-grid">
            <button class="company-btn" onclick="comp('BTC', 125)">BTC</button>
            <button class="company-btn" onclick="comp('SAM', 120)">SAM</button>
            <button class="company-btn" onclick="comp('سويس جولد', 130)">Swiss Gold</button>
        </div>
        <div id="res-bullion" style="display:none; margin-top:20px; color:#f1c40f; font-size:20px;">
            السعر: <span id="c-price">0</span> ج.م
        </div>
    </div>
</div>

<!-- 3. صفحة الحاسبة والزكاة -->
<div id="calc-page" class="page-section">
    <div class="main-title" style="font-size: 25px; text-align:center;">🧮 الحاسبة الذكية</div>
    <div class="bullion-box">
        <input type="number" id="g-w" class="input-style" placeholder="الوزن">
        <select id="g-c" class="input-style">
            <option value="24">عيار 24</option>
            <option value="21">عيار 21</option>
            <option value="18">عيار 18</option>
        </select>
        <button class="btn-gold" style="background:#f1c40f; padding:15px; border-radius:8px; width:100%;" onclick="runGoldCalc()">احسب</button>
        <p id="g-res" style="display:none; color:#f1c40f;">الإجمالي: <span id="g-val">0</span></p>
    </div>
</div>

<!-- الأزرار السفلية -->
<div class="bottom-nav">
    <div class="nav-item active" onclick="showTab('home-page', this)">🏠<br>الرئيسية</div>
    <div class="nav-item" onclick="showTab('bullion-page', this)">🏆<br>السبائك</div>
    <div class="nav-item" onclick="showTab('calc-page', this)">🧮<br>الحاسبة</div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    // تهيئة Firebase
    const firebaseConfig = { databaseURL: "https://shrouk-ehab-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // وظيفة التنقل بين الصفحات المبرمجة
    function showTab(id, el) {
        // إخفاء كل الصفحات
        document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active-page'));
        // إظهار الصفحة المطلوبة فقط
        document.getElementById(id).classList.add('active-page');
        // تحديث شكل الأزرار
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        // الصعود لأعلى الصفحة فوراً عند الانتقال
        window.scrollTo(0, 0);
    }

    // جلب الأسعار والعمليات الحسابية بنفس منطق كودك الأصلي
    async function updatePrices() {
        try {
            const res = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT');
            const data = await res.json();
            const globalPrice = parseFloat(data.price);
            const p24 = (globalPrice / 31.1035) * 50; // افتراض سعر الدولار 50
            document.getElementById('p24').innerText = Math.round(p24).toLocaleString();
            document.getElementById('p21').innerText = Math.round(p24 * 0.875).toLocaleString();
            document.getElementById('p18').innerText = Math.round(p24 * 0.75).toLocaleString();
            window.p24_current = p24;
        } catch (e) { console.log("خطأ تحديث"); }
    }

    function comp(name, fee) {
        const w = parseFloat(document.getElementById('b-weight').value);
        if(window.p24_current) {
            let total = (window.p24_current + fee) * w;
            document.getElementById('c-price').innerText = Math.round(total).toLocaleString();
            document.getElementById('res-bullion').style.display = 'block';
        }
    }

    updatePrices();
    setInterval(updatePrices, 30000);
</script>

</body>
</html>
