<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شروق الذهب - النسخة الاحترافية</title>
    <style>
        /* تصميم الواجهة الذهبية والأسود الملكي */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
        }

        .header {
            text-align: center;
            padding: 30px 10px;
            width: 100%;
        }

        .header h1 {
            color: #ffcc00;
            font-size: 50px;
            margin: 0;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.6);
        }

        .header p {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .container {
            width: 90%;
            max-width: 500px;
        }

        /* تصميم المربعات نفس الصورة المطلوبة */
        .price-card {
            background-color: #1a1a1a;
            border: 2px solid #333;
            border-radius: 20px;
            margin-bottom: 20px;
            padding: 25px;
            text-align: center;
            transition: border-color 0.3s;
        }

        .price-card:hover {
            border-color: #ffcc00;
        }

        .label {
            color: #aaa;
            font-size: 16px;
            margin-bottom: 10px;
            display: block;
        }

        .value {
            color: #ffcc00;
            font-size: 45px;
            font-weight: bold;
            display: block;
            margin: 5px 0;
        }

        .unit {
            color: #666;
            font-size: 13px;
        }

        /* المؤشر في الأسفل */
        .chart-section {
            width: 100%;
            height: 300px;
            margin-top: 20px;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>شروق الذهب</h1>
        <p>تحديثات الذهب والتحليلات الاقتصادية لحظة بلحظة</p>
    </div>

    <div class="container">
        <div class="price-card">
            <span class="label">عيار 24</span>
            <span class="value" id="g24">جاري التحديث...</span>
            <span class="unit">جنيه مصري / جرام</span>
        </div>

        <div class="price-card">
            <span class="label">عيار 21</span>
            <span class="value" id="g21">جاري التحديث...</span>
            <span class="unit">جنيه مصري / جرام</span>
        </div>

        <div class="price-card">
            <span class="label">عيار 18</span>
            <span class="value" id="g18">جاري التحديث...</span>
            <span class="unit">جنيه مصري / جرام</span>
        </div>

        <div class="price-card">
            <span class="label">الأونصة العالمية</span>
            <span class="value" id="gxau">...</span>
            <span class="unit">دولار أمريكي</span>
        </div>
    </div>

    <div class="chart-section">
        <div id="gold_chart" style="height:100%; width:100%;"></div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        // تشغيل المؤشر العالمي في الأسفل
        new TradingView.widget({
            "autosize": true, "symbol": "OANDA:XAUUSD", "interval": "1", "theme": "dark", "style": "1", "locale": "ar", "container_id": "gold_chart"
        });

        // دالة جلب السعر الحقيقي الآن
        async function getLiveGold() {
            try {
                // جلب السعر من البورصة العالمية لحظياً
                const res = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT');
                const data = await res.json();
                const globalOunce = parseFloat(data.price);
                
                // سعر الدولار في الصاغة اليوم (تحديث مايو 2026)
                const usdInEgypt = 52.65; 

                // عرض الأونصة عالمياً
                document.getElementById('gxau').innerText = Math.round(globalOunce).toLocaleString() + "$";
                
                // حساب العيارات المحلية بدقة
                // الأونصة = 31.10 جرام
                const price24 = (globalOunce / 31.1035) * usdInEgypt;
                
                document.getElementById('g24').innerText = Math.round(price24).toLocaleString();
                document.getElementById('g21').innerText = Math.round(price24 * 0.875).toLocaleString();
                document.getElementById('g18').innerText = Math.round(price24 * 0.75).toLocaleString();

            } catch (e) {
                console.log("إعادة المحاولة...");
            }
        }

        // التحديث كل 10 ثوانٍ لضمان "اللحظة بلحظة"
        getLiveGold();
        setInterval(getLiveGold, 10000);
    </script>
</body>
</html>
