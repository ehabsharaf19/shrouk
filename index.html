<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شروق الذهب - EMOSHA Gold</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .main-title { font-size: 50px; font-weight: bold; color: #f1c40f; text-shadow: 0 0 20px rgba(241, 196, 15, 0.7); margin-top: 20px; }
        .gateway-text { color: #666; font-size: 14px; letter-spacing: 3px; margin-bottom: 20px; }
        
        .ticker-wrap { width: 100%; background: #f1c40f; color: #000; padding: 12px 0; overflow: hidden; white-space: nowrap; font-weight: bold; font-size: 17px; margin-bottom: 25px; border-bottom: 2px solid #fff; }
        .ticker-move { display: inline-block; animation: ticker 150s linear infinite; padding-left: 100%; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .market-stats { display: flex; justify-content: space-between; background: #1a1a1a; padding: 10px 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #333; width: 90%; max-width: 420px; }
        .stat-item { text-align: center; flex: 1; }
        .stat-label { color: #888; font-size: 11px; display: block; }
        .stat-value { color: #2ecc71; font-size: 14px; font-weight: bold; }
        
        .main-layout { display: flex; gap: 20px; width: 95%; max-width: 1100px; margin-top: 20px; align-items: flex-start; }
        .articles-main { flex: 2; width: 100%; }
        
        .article-item { display: none; border-bottom: 1px solid #333; margin-bottom: 15px; background: #111; border-radius: 12px; overflow: hidden; }
        .article-item.visible { display: block; }
        .article-header { background: #1a1a1a; color: #f1c40f; padding: 18px; cursor: pointer; font-weight: bold; font-size: 18px; text-align: right; }
        .article-content { max-height: 0; padding: 0 15px; color: #ccc; background: #0a0a0a; transition: max-height 0.4s ease-out; overflow: hidden; text-align: right; }
        .article-item.active .article-content { max-height: none; padding: 25px; border-top: 1px solid #333; }
        .article-image { width: 100%; border-radius: 12px; margin-bottom: 15px; }

        /* تنسيق أزرار التحكم */
        .admin-controls { display: flex; gap: 10px; margin-top: 15px; border-top: 1px solid #333; padding-top: 15px; }
        .btn-edit { background: #f1c40f; color: #000; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; flex: 1; }
        .btn-delete { background: #c0392b; color: #fff; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; flex: 1; }

        .sidebar { flex: 1; position: sticky; top: 20px; }
        .sidebar-box { background: #111; padding: 20px; border-radius: 15px; border: 1px solid #333; margin-bottom: 20px; text-align: right; }
        
        #admin-panel-emosha { display: none; width: 90%; max-width: 450px; margin: 20px auto; background: #1a1a1a; padding: 25px; border-radius: 15px; border: 2px solid #f1c40f; }
        .input-style { width: 94%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; }
        .btn-gold { background: #f1c40f; color: #000; padding: 14px; border: none; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; }

        .footer-gold { background: #000; color: #f1c40f; text-align: center; padding: 45px; border-top: 2px solid #f1c40f; width: 100%; margin-top: 60px; }
    </style>
</head>
<body>
    <div class="main-title">شروق الذهب</div>
    <div class="gateway-text">EMOSHA GOLD</div>

    <div class="ticker-wrap"><div class="ticker-move" id="news-ticker">جاري التحميل...</div></div>
    
    <div class="market-stats">
        <div class="stat-item"><span class="stat-label">الأونصة عالمياً</span><span class="stat-value" id="global-ounce">$...</span></div>
        <div class="stat-item"><span class="stat-label">سعر الدولار</span><span class="stat-value" id="usd-rate">...</span></div>
    </div>

    <div class="main-layout">
        <div class="articles-main">
            <h2 style="color: #f1c40f; text-align: right; border-right: 6px solid #f1c40f; padding-right: 15px;">📰 أحدث تحليلات القبطان</h2>
            <div id="posts-container">جاري التحميل...</div>
        </div>

        <aside class="sidebar">
            <div class="sidebar-box">
                <h3>👤 عن القبطان</h3>
                <p style="font-size: 14px; color: #bbb;">منصة شروق الذهب بإشراف القبطان إيهاب شرف.</p>
                <hr style="border:0; border-top:1px solid #222; margin:15px 0;">
                <span onclick="openSecretPanel()" style="cursor: pointer; color: #222; font-size: 10px; display: block; text-align: center;">دخول</span>
            </div>
        </aside>
    </div>

    <div id="admin-panel-emosha">
        <h3 id="admin-title" style="color: #f1c40f; text-align: center;">إدارة المحتوى</h3>
        <input type="hidden" id="edit-post-id">
        <input type="text" id="post-title" class="input-style" placeholder="العنوان">
        <input type="text" id="post-image" class="input-style" placeholder="رابط الصورة">
        <textarea id="post-content" class="input-style" rows="10" placeholder="المحتوى"></textarea>
        <button id="submit-btn" class="btn-gold" onclick="addPost()">نشر الآن</button>
        <button onclick="logoutAdmin()" style="background:#444; color:#fff; width:100%; border:none; padding:10px; margin-top:5px; cursor:pointer;">خروج من الإدارة</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { databaseURL: "https://shrouk-ehab-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        let isAdmin = false; // القيمة الافتراضية: لست مديراً

        // الدالة المسؤولة عن عرض المقالات (تم تعديلها جذرياً)
        function loadArticles() {
            database.ref('posts').on('value', (snapshot) => {
                const container = document.getElementById('posts-container');
                container.innerHTML = "";
                const data = snapshot.val();
                
                if(data) {
                    const keys = Object.keys(data).reverse();
                    keys.forEach((id, index) => {
                        const post = data[id];
                        
                        // هنا السحر: إنشاء أزرار الإدارة فقط إذا كان isAdmin = true
                        let adminHTML = "";
                        if(isAdmin) {
                            adminHTML = `
                                <div class="admin-controls">
                                    <button class="btn-edit" onclick="prepareEdit('${id}', '${post.title}', '${post.image}', \`${post.content}\`)">تعديل</button>
                                    <button class="btn-delete" onclick="deletePost('${id}')">حذف</button>
                                </div>`;
                        }

                        container.innerHTML += `
                            <div class="article-item visible">
                                <div class="article-header" onclick="this.parentElement.classList.toggle('active')">${post.title}</div>
                                <div class="article-content">
                                    ${post.image ? `<img src="${post.image}" class="article-image">` : ""}
                                    <div style="white-space: pre-wrap; line-height: 1.8;">${post.content}</div>
                                    <div style="margin-top:15px; color:#f1c40f; font-size:13px;">📅 ${post.date || ''} | 📝 القبطان إيهاب شرف</div>
                                    ${adminHTML} 
                                </div>
                            </div>`;
                    });
                }
            });
        }

        function openSecretPanel() {
            let p = prompt("كلمة السر:");
            if(p === "1230") {
                isAdmin = true; // تفعيل وضع المدير
                document.getElementById('admin-panel-emosha').style.display = 'block';
                loadArticles(); // إعادة تحميل المقالات لتظهر الأزرار لك أنت فقط
                alert("مرحباً بك يا قبطان.. تم تفعيل صلاحيات الحذف.");
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            document.getElementById('admin-panel-emosha').style.display = 'none';
            loadArticles(); // إعادة تحميل لإخفاء الأزرار نهائياً
        }

        function deletePost(id) {
            if(confirm("حذف نهائي؟")) database.ref('posts/' + id).remove();
        }

        function addPost() {
            const t = document.getElementById('post-title').value;
            const c = document.getElementById('post-content').value;
            const id = document.getElementById('edit-post-id').value;
            const d = new Date().toLocaleDateString('ar-EG');
            if(t && c) {
                if(id) database.ref('posts/' + id).update({ title: t, content: c, image: document.getElementById('post-image').value });
                else database.ref('posts').push({ title: t, content: c, image: document.getElementById('post-image').value, date: d });
                alert("تم بنجاح");
            }
        }

        function prepareEdit(id, title, img, content) {
            document.getElementById('edit-post-id').value = id;
            document.getElementById('post-title').value = title;
            document.getElementById('post-image').value = img;
            document.getElementById('post-content').value = content;
            window.scrollTo(0,0);
        }

        // تشغيل التحميل لأول مرة
        loadArticles();
    </script>
</body>
</html>
