<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>شروق الذهب - EMOSHA Gold</title>
    <!-- ده الكود بتاعك في التنسيق بدون تغيير -->
    <style>
        body { background-color: #000; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .header { text-align: center; padding: 20px; color: #f1c40f; font-size: 30px; font-weight: bold; }
        .page { display: none; padding: 20px; padding-bottom: 80px; }
        .active { display: block; }
        .card { background: #111; border: 1px solid #f1c40f; border-radius: 10px; padding: 15px; margin-bottom: 10px; text-align: center; }
        .price { font-size: 25px; color: #f1c40f; }
        /* شريط التنقل السفلي */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #111; display: flex; border-top: 1px solid #f1c40f; }
        .nav-item { flex: 1; text-align: center; padding: 15px; color: #888; cursor: pointer; }
        .nav-item.active-nav { color: #f1c40f; font-weight: bold; }
        input, select, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; }
        #admin-panel { display: none; background: #222; padding: 15px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">شروق الذهب <br> <small style="font-size: 15px;">EMOSHA GOLD</small></div>

    <!-- الصفحة الأولى: الرئيسية -->
    <div id="page1" class="page active">
        <div class="card">عالمياً: <span id="global-price">0</span></div>
        <div class="card">عيار 24: <span id="p24" class="price">0</span></div>
        <div class="card">عيار 21: <span id="p21" class="price">0</span></div>
        <div class="card">عيار 18: <span id="p18" class="price">0</span></div>
        
        <div id="articles-container"></div>
        
        <button onclick="checkAdmin()" style="background: transparent; border: none; color: #333;">الإدارة</button>
        <div id="admin-panel">
            <input type="text" id="title" placeholder="العنوان">
            <textarea id="content" placeholder="المحتوى" rows="4" style="width: 100%;"></textarea>
            <button onclick="publish()" style="background: #f1c40f;">نشر</button>
        </div>
    </div>

    <!-- الصفحة الثانية: السبائك -->
    <div id="page2" class="page">
        <h2 style="text-align: center; color: #f1c40f;">أسعار السبائك</h2>
        <div class="card">
            <select id="weight">
                <option value="1">1 جرام</option>
                <option value="5">5 جرام</option>
                <option value="10">10 جرام</option>
                <option value="31.1">أونصة</option>
            </select>
            <button onclick="calcBullion('BTC')">سعر BTC</button>
            <button onclick="calcBullion('SAM')">سعر SAM</button>
            <p id="bullion-res"></p>
        </div>
    </div>

    <!-- الصفحة الثالثة: الحاسبة -->
    <div id="page3" class="page">
        <h2 style="text-align: center; color: #f1c40f;">الحاسبة والزكاة</h2>
        <div class="card">
            <input type="number" id="calc-w" placeholder="الوزن">
            <select id="calc-c">
                <option value="24">24</option>
                <option value="21">21</option>
                <option value="18">18</option>
            </select>
            <button onclick="calculateTotal()">احسب السعر</button>
            <p id="total-res"></p>
        </div>
    </div>

    <!-- بار التنقل -->
    <div class="nav-bar">
        <div class="nav-item active-nav" onclick="nav('page1', this)">الرئيسية</div>
        <div class="nav-item" onclick="nav('page2', this)">السبائك</div>
        <div class="nav-item" onclick="nav('page3', this)">الحاسبة</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // إعدادات Firebase بتاعتك يا قبطان
        const firebaseConfig = { databaseURL: "https://shrouk-ehab-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function nav(pageId, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-nav'));
            el.classList.add('active-nav');
        }

        async function getPrices() {
            try {
                const res = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT');
                const data = await res.json();
                const global = parseFloat(data.price);
                const egp = 50; // سعر تقريبي للدولار
                const p24 = (global / 31.1) * egp;
                
                document.getElementById('global-price').innerText = "$" + Math.round(global);
                document.getElementById('p24').innerText = Math.round(p24);
                document.getElementById('p21').innerText = Math.round(p24 * 0.875);
                document.getElementById('p18').innerText = Math.round(p24 * 0.75);
                window.currentP24 = p24;
            } catch(e) { console.log("خطأ في السعر"); }
        }

        function checkAdmin() {
            if(prompt("كلمة السر") === "1230") document.getElementById('admin-panel').style.display = 'block';
        }

        function publish() {
            const t = document.getElementById('title').value;
            const c = document.getElementById('content').value;
            db.ref('posts').push({ title: t, content: c });
            alert("تم النشر");
        }

        db.ref('posts').on('value', snap => {
            const cont = document.getElementById('articles-container');
            cont.innerHTML = "";
            snap.forEach(child => {
                cont.innerHTML += `<div class="card"><h3>${child.val().title}</h3><p>${child.val().content}</p></div>`;
            });
        });

        function calcBullion(comp) {
            const w = document.getElementById('weight').value;
            const fee = comp === 'BTC' ? 120 : 110;
            const total = (window.currentP24 + fee) * w;
            document.getElementById('bullion-res').innerText = "السعر: " + Math.round(total) + " ج.م";
        }

        getPrices();
    </script>
</body>
</html>
