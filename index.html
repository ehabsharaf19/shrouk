<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شروق الذهب - EMOSHA Gold</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .main-title { font-size: 45px; font-weight: bold; color: #f1c40f; text-shadow: 0 0 15px rgba(241, 196, 15, 0.5); margin-top: 20px; }
        .ticker-wrap { width: 100%; background: #f1c40f; color: #000; padding: 10px 0; overflow: hidden; white-space: nowrap; font-weight: bold; margin-bottom: 20px; }
        .ticker-move { display: inline-block; animation: ticker 150s linear infinite; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .gold-container { width: 90%; max-width: 400px; margin-bottom: 25px; }
        .gold-card { background: #111; border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 10px; text-align: center; border-top: 4px solid #f1c40f; }
        .card-price { color: #f1c40f; font-size: 35px; font-weight: bold; }

        .main-layout { display: flex; gap: 20px; width: 95%; max-width: 1000px; }
        .articles-main { flex: 2; width: 100%; }
        .article-item { border-bottom: 1px solid #333; margin-bottom: 15px; background: #111; border-radius: 10px; overflow: hidden; }
        .article-header { background: #1a1a1a; color: #f1c40f; padding: 15px; cursor: pointer; font-weight: bold; text-align: right; }
        .article-content { display: none; padding: 20px; color: #ccc; text-align: right; line-height: 1.8; }
        .article-item.active .article-content { display: block; }
        .article-image { width: 100%; border-radius: 8px; margin-bottom: 15px; }

        /* منطقة التحكم المخفية تماماً */
        .admin-btn-group { display: flex; gap: 10px; margin-top: 15px; border-top: 1px solid #444; padding-top: 15px; }
        .btn-edit { background: #f1c40f; color: #000; border: none; padding: 7px; cursor: pointer; flex: 1; font-weight: bold; }
        .btn-delete { background: #c0392b; color: #fff; border: none; padding: 7px; cursor: pointer; flex: 1; font-weight: bold; }

        #admin-panel-emosha { display: none; background: #1a1a1a; padding: 20px; border: 2px solid #f1c40f; border-radius: 15px; width: 90%; max-width: 400px; margin: 20px auto; }
        .input-style { width: 95%; padding: 10px; margin: 8px 0; background: #222; color: #fff; border: 1px solid #444; border-radius: 5px; }
        
        .sidebar { flex: 1; }
        .sidebar-box { background: #111; padding: 15px; border-radius: 10px; border: 1px solid #333; text-align: right; }
    </style>
</head>
<body>
    <div class="main-title">شروق الذهب</div>
    <div class="ticker-wrap"><div class="ticker-move" id="news-ticker">تحميل الأخبار...</div></div>

    <div class="gold-container">
        <div class="gold-card">عيار 21<br><span class="card-price" id="p21">...</span></div>
    </div>

    <div class="main-layout">
        <div class="articles-main" id="posts-container">تحميل المقالات...</div>
        <aside class="sidebar">
            <div class="sidebar-box">
                <h3 style="color:#f1c40f">عن القبطان</h3>
                <p>منصة إخبارية بإشراف القبطان إيهاب شرف.</p>
                <hr style="border-color:#222">
                <span onclick="loginAdmin()" style="cursor:pointer; color:#222; font-size:9px">دخول</span>
            </div>
        </aside>
    </div>

    <div id="admin-panel-emosha">
        <h3 style="color:#f1c40f; text-align:center">لوحة التحكم</h3>
        <input type="hidden" id="edit-post-id">
        <input type="text" id="post-title" class="input-style" placeholder="العنوان">
        <input type="text" id="post-image" class="input-style" placeholder="رابط الصورة">
        <textarea id="post-content" class="input-style" rows="6" placeholder="الموضوع"></textarea>
        <button class="btn-edit" style="width:100%" onclick="savePost()">نشر الآن</button>
        <button onclick="logoutAdmin()" style="width:100%; margin-top:5px; background:#444; color:#fff; border:none; padding:5px; cursor:pointer">خروج</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { databaseURL: "https://shrouk-ehab-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        let isAdminActive = false; // حالة الإدارة افتراضياً "مغلق"

        function renderPosts() {
            database.ref('posts').on('value', (snapshot) => {
                const container = document.getElementById('posts-container');
                container.innerHTML = "";
                const data = snapshot.val();
                if(data) {
                    Object.keys(data).reverse().forEach(id => {
                        const post = data[id];
                        const item = document.createElement('div');
                        item.className = 'article-item';
                        
                        // هنا السحر: الأزرار لا تضاف إلا لو isAdminActive تساوي true
                        let adminButtons = "";
                        if(isAdminActive) {
                            adminButtons = `
                                <div class="admin-btn-group">
                                    <button class="btn-edit" onclick="startEdit('${id}', '${post.title.replace(/'/g,"")}', '${post.image}', \`${post.content.replace(/`/g,"")}\`)">تعديل</button>
                                    <button class="btn-delete" onclick="deletePost('${id}')">حذف</button>
                                </div>`;
                        }

                        item.innerHTML = `
                            <div class="article-header" onclick="this.parentElement.classList.toggle('active')">${post.title}</div>
                            <div class="article-content">
                                ${post.image ? `<img src="${post.image}" class="article-image">` : ""}
                                <div style="white-space: pre-wrap;">${post.content}</div>
                                <div style="color:#f1c40f; margin-top:15px; font-size:12px">📅 ${post.date || ''} | 📝 القبطان إيهاب شرف</div>
                                ${adminButtons}
                            </div>`;
                        container.appendChild(item);
                    });
                }
            });
        }

        function loginAdmin() {
            let p = prompt("كلمة السر:");
            if(p === "1230") {
                isAdminActive = true;
                document.getElementById('admin-panel-emosha').style.display = 'block';
                renderPosts(); // إعادة رسم المقالات لإظهار الأزرار
                alert("مرحباً يا قبطان.");
            }
        }

        function logoutAdmin() {
            isAdminActive = false;
            document.getElementById('admin-panel-emosha').style.display = 'none';
            renderPosts(); // إعادة رسم المقالات لإخفاء الأزرار نهائياً
        }

        function savePost() {
            const t = document.getElementById('post-title').value;
            const c = document.getElementById('post-content').value;
            const img = document.getElementById('post-image').value;
            const id = document.getElementById('edit-post-id').value;
            const date = new Date().toLocaleDateString('ar-EG');

            if(t && c) {
                if(id) {
                    database.ref('posts/' + id).update({ title: t, content: c, image: img });
                } else {
                    database.ref('posts').push({ title: t, content: c, image: img, date: date });
                }
                document.getElementById('edit-post-id').value = "";
                alert("تم بنجاح");
            }
        }

        function deletePost(id) {
            if(confirm("حذف؟")) database.ref('posts/' + id).remove();
        }

        function startEdit(id, title, img, content) {
            document.getElementById('edit-post-id').value = id;
            document.getElementById('post-title').value = title;
            document.getElementById('post-image').value = img;
            document.getElementById('post-content').value = content;
            window.scrollTo(0,0);
        }

        renderPosts(); // تشغيل العرض عند فتح الموقع لأول مرة (بدون أزرار)
    </script>
</body>
</html>
