<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شروق الذهب | السعر اللحظي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary-gold: #D4AF37;
            --dark-gold: #996515;
            --bg-dark: #121212;
            --card-bg: #ffffff;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; color: #333; }
        
        /* الهيدر الاحترافي */
        header { 
            background: linear-gradient(135deg, var(--bg-dark) 0%, #2c2c2c 100%);
            color: var(--primary-gold);
            padding: 40px 20px;
            text-align: center;
            border-bottom: 5px solid var(--primary-gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        header h1 { margin: 0; font-size: 2.5rem; letter-spacing: 2px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        header p { color: #ccc; margin-top: 10px; font-size: 1.1rem; }

        .container { max-width: 1100px; margin: -30px auto 40px; padding: 0 20px; }

        /* كروت الأسعار */
        .price-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .price-card { 
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border: 1px solid #eee;
            transition: transform 0.3s;
            position: relative;
            overflow: hidden;
        }
        .price-card:hover { transform: translateY(-10px); border-color: var(--primary-gold); }
