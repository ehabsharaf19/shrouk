<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شروق الذهب - إيموشا مباشر</title>
    <style>
        /* تصميم الأسود الملكي الخرافي */
        body {
            background: radial-gradient(circle at top, #1a1a1a 0%, #000000 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0; padding: 0; min-height: 100vh;
            overflow-x: hidden;
        }

        .header-section { text-align: center; padding: 40px 20px; }
        
        /* شروق الذهب بالبنط العريض والتوهج الذهبي */
        .main-title {
            font-size: clamp(40px, 10vw, 65px);
            font-weight: 900;
            background: linear-gradient(to bottom, #ffffff 0%, #f1c40f 50%, #b8860b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(241, 196, 15, 0.8));
            margin: 0;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            from { filter: drop-shadow(0 0 15px rgba(241, 196, 15, 0.6)); }
            to { filter: drop-shadow(0 0 30px rgba(241, 196, 15, 1)); }
        }

        .container { max-width: 800px; margin: auto; padding: 10px; }

        /* بطاقات الأسعار - نفس الواجهة التي أعجبتك */
        .price-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(241, 196, 15, 0.4);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            margin-bottom: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .price-card h3 { color: #aaa; font-size: 18px; margin: 0 0 10px 0; }
        .price-card .price { color: #f1c40f; font-size: 45px; font-weight: bold; line-height: 1; }
        .price-card .unit { font-size: 14px; color: #666; display: block; margin-top: 10px; }

        /* إخفاء المؤشر تماماً من الواجهة الرئيسية لراحة العين */
        #tv_chart_container { display: none; }
    </style>
</head>
<body>

    <div class="header-section">
        <h1 class="main-title">شروق الذهب</h1>
        <p style="color: #666; letter-spacing: 2px; margin-top: 10px;">EMOSHA ECONOMY GATEWAY</p>
    </div>

    <div class="container">
        <div class="price-card">
            <h3>عيار 24</h3>
            <div class="price" id="g24">...</div>
            <span class="unit">جنيه مصري / جرام</span>
        </div>

        <div class="price-card">
            <h3>عيار 21</h3>
            <div class="price" id="g21">...</div>
            <span class="unit">جنيه مصري / جرام</span>
        </div>

        <div class="price-card">
            <h3>عيار 18</h3>
            <div class="price" id="g18">...</div>
            <span class="unit">جنيه مصري / جرام</span>
        </div>

        <div class="price-card">
            <h3>الأونصة العالمية</h3>
            <div class="price" id="gxau">...</div>
            <span class="unit">دولار أمريكي</span>
        </div>
    </div>

    <script>
        // دالة الذكاء الاصطناعي لجلب الأسعار لحظة بلحظة
        async function updatePrices() {
            try {
                // الاتصال ببورصة الذهب العالمية (Binance PAXG)
                const response = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT');
                const data = await response.json();
                const globalPrice = parseFloat(data.price);

                // --- معادلة حساب السعر المحلي في مصر ---
                // ملاحظة للقبطان: السعر العالمي يقسم على 31.1 (وزن الأونصة) ثم يضرب في سعر الدولار
                const usdMarketRate = 48.45; // يمكنك تعديل هذا الرقم لضبط السعر بدقة في مصر
                const pricePerGram24 = (globalPrice / 31.1035) * usdMarketRate;

                // تحديث الشاشة
                document.getElementById('gxau').innerText = Math.round(globalPrice).toLocaleString() + "$";
                document.getElementById('g24').innerText = Math.round(pricePerGram24).toLocaleString();
                document.getElementById('g21').innerText = Math.round(pricePerGram24 * 0.875).toLocaleString();
                document.getElementById('g18').innerText = Math.round(pricePerGram24 * 0.75).toLocaleString();

                console.log("تم التحديث اللحظي بنجاح");
            } catch (error) {
                console.error("خطأ في الاتصال بالبورصة");
            }
        }

        // التحديث كل 10 ثوانٍ كما طلبت
        updatePrices();
        setInterval(updatePrices, 10000);
    </script>
</body>
</html>
