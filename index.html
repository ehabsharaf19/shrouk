<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شروق الذهب - أسعار الذهب اللحظية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #d4af37; --dark: #1a1a1a; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f4f4; text-align: center; }
        header { background: var(--dark); color: var(--gold); padding: 30px; border-bottom: 4px solid var(--gold); }
        nav { background: #333; padding: 10px; }
        nav a { color: white; text-decoration: none; margin: 0 15px; }
        .container { max-width: 900px; margin: 20px auto; padding: 20px; }
        .gold-prices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .price-card { background: white; padding: 20px; border-radius: 12px; border: 1px solid var(--gold); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .price-card h3 { color: var(--gold); margin: 0; }
        .price-card p { font-size: 1.5rem; font-weight: bold; margin: 15px 0 0; color: #333; }
        footer { background: var(--dark); color: white; padding: 20px; margin-top: 50px; }
    </style>
</head>
<body>

<header>
    <h1><i class="fas fa-chart-line"></i> شروق الذهب</h1>
    <p>تغطية حصرية وشاملة لأسعار الذهب والاقتصاد</p>
</header>

<nav>
    <a href="#">الرئيسية</a>
    <a href="#">الذهب اليوم</a>
    <a href="#">من نحن</a>
</nav>

<div class="container">
    <h2>الأسعار الحالية (تحديث تلقائي)</h2>
    <div class="gold-prices">
        <div class="price-card"><h3>عيار 24</h3><p id="gold-24">جاري التحميل...</p></div>
        <div class="price-card"><h3>عيار 21</h3><p id="gold-21">جاري التحميل...</p></div>
        <div class="price-card"><h3>عيار 18</h3><p id="gold-18">جاري التحميل...</p></div>
        <div class="price-card"><h3>الجنيه الذهب</h3><p id="gold-coin">جاري التحميل...</p></div>
    </div>
</div>

<footer>
    <p>حقوق النشر © 2026 - إشراف إيهاب شرف</p>
</footer>

<script>
// هذه الوظيفة تجلب الأسعار (ستحتاج لوضع مفتاح الـ API الخاص بك مكان الكلمة المكتوبة)
async function getPrices() {
    try {
        // تنبيه: ستحتاج للحصول على API Key لوضعه هنا لتعمل الأسعار الحقيقية
        const apiKey = "ضع_مفتاح_الربط_هنا"; 
        const url = `https://api.metals.dev/v1/latest?api_key=${apiKey}&currency=EGP&unit=g`;
        
        const response = await fetch(url);
        const data = await response.json();
        
        const price24 = data.metals.gold;
        document.getElementById('gold-24').innerText = Math.round(price24) + " ج.م";
        document.getElementById('gold-21').innerText = Math.round(price24 * 0.875) + " ج.م";
        document.getElementById('gold-18').innerText = Math.round(price24 * 0.75) + " ج.م";
        document.getElementById('gold-coin').innerText = Math.round(price24 * 8) + " ج.م";
    } catch (e) {
        document.getElementById('gold-24').innerText = "تحديث يدوي";
        // يمكنك هنا وضع أسعار ثابتة يدوياً إذا لم يتوفر الإنترنت
    }
}
getPrices();
</script>

</body>
</html>
