<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شروق الذهب - EMOSHA</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        /* عنوان شروق الذهب المضيء */
        .main-title {
            font-size: 50px;
            font-weight: bold;
            color: #f1c40f;
            text-shadow: 0 0 20px rgba(241, 196, 15, 0.8);
            margin-bottom: 5px;
            margin-top: 20px;
        }

        .gateway-text {
            color: #888;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }

        .container { width: 100%; max-width: 450px; }

        /* تصميم البطاقات الاحترافي */
        .gold-card {
            background: #111;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 15px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .gold-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: #f1c40f;
        }

        .card-label { color: #aaa; font-size: 16px; margin-bottom: 10px; display: block; }
        
        .card-price { 
            color: #f1c40f; 
            font-size: 42px; 
            font-weight: 900; 
            display: block;
        }

        .card-unit { color: #555; font-size: 12px; margin-top: 5px; display: block; }

        /* شريط التحديث اللحظي */
        .live-indicator {
            font-size: 12px;
            color: #2ecc71;
            margin-bottom: 20px;
            display: flex; align-items: center; gap: 5px;
        }
        .dot { width: 8px; height: 8px; background: #2ecc71; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="main-title">شروق الذهب</div>

    <div class="live-indicator">
        <div class="dot"></div> تحديث مباشر للسوق المصري
    </div>

    <div class="container">
        <div class="gold-card">
            <span class="card-label">عيار 24</span>

            <span class="card-unit">جنيه مصري / جرام</span>
        </div>
