<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شروق الذهب - EMOSHA Gold</title>
    <style>
        body {
            background: #000; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }
        .main-title {
            font-size: 50px; font-weight: bold; color: #f1c40f;
            text-shadow: 0 0 20px rgba(241, 196, 15, 0.7); margin-top: 20px;
        }
        /* تم تعديل الكلمة لتصبح EMOSHA فقط */
        .gateway-text { color: #666; font-size: 12px; letter-spacing: 2px; margin-bottom: 30px; }
        .container { width: 100%; max-width: 450px; }
        
        .gold-card {
            background: #111; border: 1px solid #333; border-radius: 15px;
            padding: 25px; margin-bottom: 15px; text-align: center; position: relative;
        }
        .gold-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: #f1c40f; }
        .card-label { color: #aaa; font-size: 16px; display: block; margin-bottom: 5px; }
        .card-price { color: #f1c40f; font-size: 45px; font-weight: 900; display: block; }
        
        .article-section { background: #0a0a0a; padding: 25px; border-radius: 15px; margin-top: 25px; border: 1px dashed #f1c40f; text-align: right; }
        .article-section h2 { color: #f1c40f; font-size: 22px; border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 0; }
        .article-content { color: #ccc; font-size: 16px; line-height: 1.8; }

        footer { margin-top: 50px; padding: 30px; border-top: 1px solid #222; width: 100%; text-align: center; }
        .admin-box { background: #111; padding: 20px; border-radius: 15px; border: 1px solid #222; }
        .whatsapp-btn {
            display: inline-block; background: #25d366; color: #fff; padding: 15px 30px;
            border-radius: 40px; text-decoration: none; font-weight: bold; margin-top: 15px;
            transition: 0.3s;
        }
        .whatsapp-btn:hover { transform: scale(1.05); background: #128c7e; }
        
        .live-indicator { font-size: 13px; color: #2ecc71; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .dot { width: 8px; height: 8px; background: #2ecc71; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
