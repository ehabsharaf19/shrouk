<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script>
    // بيانات الفايربيس الخاصة بك يا قبطان
    const firebaseConfig = {
        databaseURL: "https://shrouk-ehab-default-rtdb.firebaseio.com/"
    };

    // تهيئة الفايربيس
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // جلب المقالات وعرضها فوراً
    database.ref('posts').on('value', (snapshot) => {
        const postsContainer = document.getElementById('posts-container');
        postsContainer.innerHTML = ''; 
        const data = snapshot.val();
        for (let id in data) {
            const post = data[id];
            const imgHtml = post.image ? `<img src="${post.image}" class="article-image">` : "";
            const html = `<div class="article-card">
                            <div style="color:#f1c40f; font-weight:bold;">${post.title}</div>
                            ${imgHtml}
                            <p style="color:#ccc; font-size:14px;">${post.content}</p>
                          </div>`;
            postsContainer.innerHTML = html + postsContainer.innerHTML;
        }
    });

    // تحديث الأسعار التلقائي
    async function updatePrices() {
        try {
            const usdRes = await fetch('https://open.er-api.com/v6/latest/USD');
            const usdData = await usdRes.json();
            const currentUSD = usdData.rates.EGP;
            document.getElementById('usd-rate').innerText = currentUSD.toFixed(2) + " ج.م";
            const goldRes = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT');
            const goldData = await goldRes.json();
            const globalPrice = parseFloat(goldData.price);
            document.getElementById('global-ounce').innerText = "$" + globalPrice.toLocaleString();
            const price24 = (globalPrice / 31.1035) * currentUSD;
            document.getElementById('p24').innerText = Math.round(price24).toLocaleString();
            document.getElementById('p21').innerText = Math.round(price24 * 0.875).toLocaleString();
            document.getElementById('p18').innerText = Math.round(price24 * 0.75).toLocaleString();
        } catch (e) { console.log("خطأ في التحديث"); }
    }

    // فتح لوحة التحكم بالرمز المخفي
    function openSecretPanel() {
        var pass = prompt("أدخل رمز الوصول الخاص بالقبطان:");
        if (parseInt(pass) === (1000 + 230)) {
            document.getElementById('admin-panel-emosha').style.display = 'block';
            window.scrollTo(0, document.body.scrollHeight);
        } else { alert("الرمز غير صحيح!"); }
    }

    // نشر المقال وحفظه في القاعدة للأبد
    function addPost() {
        var t = document.getElementById('post-title').value;
        var img = document.getElementById('post-image').value;
        var c = document.getElementById('post-content').value;

        if(t && c) {
            database.ref('posts').push({
                title: t,
                image: img,
                content: c
            });
            document.getElementById('admin-panel-emosha').style.display = 'none';
            document.getElementById('post-title').value = '';
            document.getElementById('post-image').value = '';
            document.getElementById('post-content').value = '';
            alert("تم الحفظ في القاعدة يا قبطان!");
        }
    }

    updatePrices();
    setInterval(updatePrices, 30000);
</script>
