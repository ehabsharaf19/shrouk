<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شروق الذهب - EMOSHA Gold</title>
    <style>
        /* التنسيقات العامة */
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .main-title { font-size: 50px; font-weight: bold; color: #f1c40f; text-shadow: 0 0 20px rgba(241, 196, 15, 0.7); margin-top: 20px; text-align: center; }
        .gateway-text { color: #666; font-size: 14px; letter-spacing: 3px; margin-bottom: 20px; text-align: center; }
        
        /* شريط الأخبار */
        .ticker-wrap { width: 100%; background: #f1c40f; color: #000; padding: 12px 0; overflow: hidden; white-space: nowrap; font-weight: bold; font-size: 17px; margin-bottom: 25px; border-bottom: 2px solid #fff; }
        .ticker-move { display: inline-block; animation: ticker 150s linear infinite; padding-left: 100%; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* نظام الأقسام (الفصل التام) */
        .page-section { display: none; width: 100%; min-height: 100vh; padding-bottom: 120px; }
        .active-page { display: block !important; }

        /* القائمة السفلية */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 15px 0; border-top: 2px solid #f1c40f; z-index: 99999; box-shadow: 0 -5px 15px rgba(0,0,0,0.5); }
        .nav-item { color: #888; text-align: center; font-size: 12px; cursor: pointer; flex: 1; transition: 0.3s; }
        .nav-item.active { color: #f1c40f; font-weight: bold; transform: scale(1.1); }

        /* الكروت والأسعار */
        .market-stats { display: flex; justify-content: space-between; background: #1a1a1a; padding: 10px 15px; border-radius: 10px; margin: 0 auto 20px; border: 1px solid #333; width: 90%; max-width: 420px; }
        .stat-value { color: #2ecc71; font-weight: bold; }
        .gold-card { background: #111; border: 1px solid #333; border-radius: 15px; padding: 20px; margin: 15px auto; text-align: center; width: 85%; max-width: 400px; position: relative; }
        .gold-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: #f1c40f; }
        .card-price { color: #f1c40f; font-size: 42px; font-weight: 900; }

        /* المقالات */
        .article-item { background: #111; border-radius: 12px; margin: 15px auto; padding: 20px; border-right: 5px solid #f1c40f; width: 90%; max-width: 800px; }
        
        /* الصناديق (السبائك والحاسبة) */
        .bullion-box { background: #1a1a1a; border: 1px solid #333; border-radius: 15px; padding: 20px; margin: 20px auto; width: 90%; max-width: 500px; text-align: center; }
        .company-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .company-btn { background: #222; color: #fff; padding: 12px; border-radius: 8px; border: 1px solid #333; cursor: pointer; }
        .input-style { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; background: #222; color: white; border: 1px solid #444; box-sizing: border-box; text-align: center; }
        .btn-gold { background: #f1c40f; color: #000; padding: 15px; border-radius: 8px; font-weight: bold; width: 100%; border: none; cursor: pointer; }

        /* لوحة الإدارة */
        #admin-panel-emosha { display: none; width: 90%; max-width: 500px; margin: 20px auto; background: #1a1a1a; padding: 20px; border-radius: 15px; border: 2px solid #f1c40f; }
    </style>
</head>
<body>

    <!-- 1. شريط التنقل السفلي -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="showTab('home-page', this)">🏠<br>الرئيسية</div>
        <div class="nav-item" onclick="showTab('bullion-page', this)">🏆<br>السبائك</div>
        <div class="nav-item" onclick="showTab('calc-page', this)">🧮<br>الحاسبة</div>
    </div>

    <!-- 2. صفحة الرئيسية (الأسعار والمقالات) -->
    <div id="home-page" class="page-section active-page">
        <div class="main-title">شروق الذهب</div>
        <div class="gateway-text">EMOSHA GOLD</div>
        <div class="ticker-wrap"><div class="ticker-move" id="news-ticker">جاري تحميل أحدث الأخبار...</div></div>
        
        <div class="market-stats">
            <div class="stat-item"><span>الأونصة:</span> <span class="stat-value" id="global-ounce">$...</span></div>
            <div class="stat-item"><span>الدولار:</span> <span class="stat-value" id="usd-rate">...</span></div>
        </div>

        <div class="gold-card"><span>عيار 24</span><br><span class="card-price" id="p24">...</span></div>
        <div class="gold-card"><span>عيار 21</span><br><span class="card-price" id="p21">...</span></div>
        <div class="gold-card"><span>عيار 18</span><br><span class="card-price" id="p18">...</span></div>

        <h2 style="color: #f1c40f; text-align: center; margin-top: 30px;">📰 تحليلات القبطان</h2>
        <div id="posts-container"></div>
        
        <center><span onclick="openSecretPanel()" style="color: #222; cursor: pointer; font-size: 10px;">إدارة المحتوى</span></center>

        <div id="admin-panel-emosha">
            <h3 style="color:#f1c40f">لوحة تحكم القبطان</h3>
            <input type="text" id="post-title" class="input-style" placeholder="عنوان الخبر">
            <textarea id="post-content" class="input-style" rows="5" placeholder="تفاصيل التحليل"></textarea>
            <button class="btn-gold" onclick="addPost()">نشر الآن</button>
        </div>
    </div>

    <!-- 3. صفحة السبائك -->
    <div id="bullion-page" class="page-section">
        <div class="main-title" style="font-size: 30px;">🏆 أسعار السبائك</div>
        <div class="bullion-box">
            <label>اختر الوزن:</label>
            <select id="b-weight" class="input-style">
                <option value="1">1 جرام</option>
                <option value="10">10 جرام</option>
                <option value="31.1">أونصة</option>
                <option value="100">100 جرام</option>
            </select>
            <div class="company-grid">
                <button class="company-btn" onclick="comp('BTC', 125)">بي تي سي (BTC)</button>
                <button class="company-btn" onclick="comp('SAM', 120)">سام (SAM)</button>
                <button class="company-btn" onclick="comp('سويس جولد', 130)">سويس جولد</button>
                <button class="company-btn" onclick="comp('إيجيبت جولد', 115)">إيجيبت جولد</button>
            </div>
            <div id="res-bullion" style="display:none; margin-top:20px; font-size:22px; color:#f1c40f;">
                <span id="c-name"></span>: <span id="c-price">0</span> ج.م
            </div>
        </div>
    </div>

    <!-- 4. صفحة الحاسبة والزكاة -->
    <div id="calc-page" class="page-section">
        <div class="main-title" style="font-size: 30px;">🧮 الحاسبة والزكاة</div>
        <div class="bullion-box">
            <h3 style="color:#f1c40f">حساب الذهب بالمصنعية</h3>
            <input type="number" id="g-w" class="input-style" placeholder="الوزن بالجرام">
            <select id="g-c" class="input-style">
                <option value="24">عيار 24</option>
                <option value="21">عيار 21</option>
                <option value="18">عيار 18</option>
            </select>
            <input type="number" id="g-m" class="input-style" placeholder="المصنعية للجرام">
            <button class="btn-gold" onclick="runGoldCalc()">احسب الإجمالي</button>
            <div id="g-res" style="display:none; color:#f1c40f; margin-top:15px; font-size: 20px;">الإجمالي: <span id="g-val">0</span> ج.م</div>
        </div>
    </div>

    <!-- السكربتات والربط -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // 1. إعدادات Firebase
        const firebaseConfig = { databaseURL: "https://shrouk-ehab-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 2. وظيفة التبديل بين الصفحات (دي اللي بتمنع التداخل)
        function showTab(tabId, element) {
            document.querySelectorAll('.page-section').forEach(section => section.classList.remove('active-page'));
            document.getElementById(tabId).classList.add('active-page');
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            element.classList.add('active');
            window.scrollTo(0,0);
        }

        // 3. تحديث الأسعار تلقائياً
        async function updatePrices() {
            try {
                const usdRes = await fetch('https://open.er-api.com/v6/latest/USD');
                const usdData = await usdRes.json();
                const currentUSD = usdData.rates.EGP;
                document.getElementById('usd-rate').innerText = currentUSD.toFixed(2) + " ج.م";

                const goldRes = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT');
                const goldData = await goldRes.json();
                const globalPrice = parseFloat(goldData.price);
                const p24 = (globalPrice / 31.1035) * currentUSD;

                document.getElementById('p24').innerText = Math.round(p24).toLocaleString();
                document.getElementById('p21').innerText = Math.round(p24 * 0.875).toLocaleString();
                document.getElementById('p18').innerText = Math.round(p24 * 0.75).toLocaleString();
                document.getElementById('global-ounce').innerText = "$" + Math.round(globalPrice).toLocaleString();
            } catch (e) { console.log("خطأ في تحديث الأسعار"); }
        }
        updatePrices(); setInterval(updatePrices, 30000);

        // 4. إدارة المقالات (Firebase)
        function addPost() {
            const title = document.getElementById('post-title').value;
            const content = document.getElementById('post-content').value;
            if(title && content) {
                database.ref('posts').push({ title, content }).then(() => {
                    alert("تم النشر بنجاح يا قبطان ✅");
                    document.getElementById('post-title').value = "";
                    document.getElementById('post-content').value = "";
                });
            }
        }

        database.ref('posts').on('value', (snapshot) => {
            const container = document.getElementById('posts-container');
            const ticker = document.getElementById('news-ticker');
            container.innerHTML = "";
            const data = snapshot.val();
            if(data) {
                const titles = [];
                Object.keys(data).reverse().forEach(id => {
                    const post = data[id];
                    titles.push("🔱 " + post.title);
                    container.innerHTML += `<div class="article-item"><h3>${post.title}</h3><p style="white-space:pre-wrap">${post.content}</p></div>`;
                });
                ticker.innerText = titles.join(" . . . . ");
            }
        });

        // 5. وظائف الحاسبة والسبائك
        function openSecretPanel() { if(prompt("كلمة السر يا قبطان:") === "1230") document.getElementById('admin-panel-emosha').style.display='block'; }

        function comp(name, fee) {
            const w = parseFloat(document.getElementById('b-weight').value);
            const p24 = parseFloat(document.getElementById('p24').innerText.replace(/,/g, ''));
            if(!isNaN(p24)) {
                document.getElementById('c-name').innerText = "سعر " + name;
                document.getElementById('c-price').innerText = Math.round((p24 + fee) * w).toLocaleString();
                document.getElementById('res-bullion').style.display = 'block';
            }
        }

        function runGoldCalc() {
            const w = parseFloat(document.getElementById('g-w').value);
            const m = parseFloat(document.getElementById('g-m').value) || 0;
            const c = document.getElementById('g-c').value;
            const p = parseFloat(document.getElementById('p' + c).innerText.replace(/,/g, ''));
            if(w > 0 && !isNaN(p)) {
                document.getElementById('g-val').innerText = Math.round((p + m) * w).toLocaleString();
                document.getElementById('g-res').style.display = 'block';
            }
        }
    </script>
</body>
</html>
