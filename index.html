<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شروق الذهب - EMOSHA Gold</title>
    <style>
        /* التنسيقات الأصلية بالكامل */
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .main-title { font-size: 50px; font-weight: bold; color: #f1c40f; text-shadow: 0 0 20px rgba(241, 196, 15, 0.7); margin-top: 20px; }
        .gateway-text { color: #666; font-size: 14px; letter-spacing: 3px; margin-bottom: 20px; }
        
        .ticker-wrap { width: 100%; background: #f1c40f; color: #000; padding: 12px 0; overflow: hidden; white-space: nowrap; font-weight: bold; font-size: 17px; margin-bottom: 25px; border-bottom: 2px solid #fff; }
        .ticker-move { display: inline-block; animation: ticker 150s linear infinite; padding-left: 100%; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* نظام الصفحات */
        .page-section { display: none; width: 100%; min-height: 100vh; padding-bottom: 120px; }
        .active-page { display: block !important; }

        .gold-card { background: #111; border: 1px solid #333; border-radius: 15px; padding: 20px; margin: 15px auto; text-align: center; width: 90%; max-width: 450px; }
        .card-price { color: #f1c40f; font-size: 42px; font-weight: 900; }
        .info-box { background: #1a1a1a; border: 1px solid #333; padding: 15px; border-radius: 10px; margin: 10px auto; width: 90%; display: flex; justify-content: space-between; }
        
        /* بار التنقل السفلي */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 15px 0; border-top: 2px solid #f1c40f; z-index: 999; }
        .nav-item { color: #888; text-align: center; font-size: 12px; cursor: pointer; flex: 1; }
        .nav-item.active { color: #f1c40f; font-weight: bold; }

        .btn-action { background: #f1c40f; color: #000; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; }
        .input-style { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; box-sizing: border-box; }
    </style>
</head>
<body>

<!-- 1. الرئيسية: تشمل الأسعار، الدولار، والصاغة -->
<div id="home-page" class="page-section active-page">
    <div class="main-title">شروق الذهب</div>
    <div class="gateway-text">EMOSHA GOLD</div>
    <div class="ticker-wrap"><div class="ticker-move" id="news-ticker">بإشراف القبطان إيهاب شرف.. جاري تحميل البيانات...</div></div>
    
    <!-- أسعار الذهب -->
    <div class="gold-card"><span>عيار 24</span><br><span class="card-price" id="p24">0</span></div>
    <div class="gold-card"><span>عيار 21</span><br><span class="card-price" id="p21">0</span></div>
    <div class="gold-card"><span>عيار 18</span><br><span class="card-price" id="p18">0</span></div>

    <!-- قسم الدولار والصاغة (اللي رجعناهم) -->
    <div class="info-box"><span>💵 سعر دولار الصاغة:</span><span id="gold-dollar" style="color:#f1c40f;">0.00</span></div>
    <div class="info-box"><span>🌍 السعر العالمي:</span><span id="global-oz" style="color:#f1c40f;">0.00</span></div>
    <div class="info-box"><span>🏦 دولار البنك:</span><span id="bank-dollar" style="color:#2ecc71;">0.00</span></div>
</div>

<!-- 2. صفحة السبائك (السباج) -->
<div id="bullion-page" class="page-section">
    <div class="main-title" style="font-size: 25px; text-align:center;">🏆 قسم السبائك والعملات</div>
    <div class="gold-card">
        <label>اختر الوزن:</label>
        <select id="b-weight" class="input-style">
            <option value="1">1 جرام</option>
            <option value="5">5 جرام</option>
            <option value="10">10 جرام</option>
            <option value="31.1">أونصة</option>
            <option value="100">100 جرام</option>
            <option value="8">جنيه ذهب</option>
        </select>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn-action" onclick="calcBullion('BTC', 150)">شركة BTC</button>
            <button class="btn-action" onclick="calcBullion('SAM', 140)">شركة SAM</button>
        </div>
        <div id="bullion-result" style="margin-top:20px; font-size:22px; color:#f1c40f; display:none;">
            السعر التقريبي: <span id="b-total">0</span> ج.م
        </div>
    </div>
</div>

<!-- 3. صفحة الحاسبة والزكاة -->
<div id="calc-page" class="page-section">
    <div class="main-title" style="font-size: 25px; text-align:center;">🧮 حاسبة الذهب والزكاة</div>
    <div class="gold-card">
        <input type="number" id="user-weight" class="input-style" placeholder="أدخل الوزن بالجرام">
        <select id="user-carat" class="input-style">
            <option value="24">عيار 24</option>
            <option value="21">عيار 21</option>
            <option value="18">عيار 18</option>
        </select>
        <button class="btn-action" onclick="calculateGold()">احسب القيمة والزكاة</button>
        <div id="calc-res" style="margin-top:20px; text-align:right; display:none;">
            <p>القيمة: <span id="res-val" style="color:#f1c40f;">0</span> ج.م</p>
            <p id="zakat-box">الزكاة: <span id="res-zakat" style="color:#ff4757;">0</span> ج.م</p>
        </div>
    </div>
</div>

<!-- بار التنقل السفلي -->
<div class="bottom-nav">
    <div class="nav-item active" onclick="showTab('home-page', this)">🏠<br>الرئيسية</div>
    <div class="nav-item" onclick="showTab('bullion-page', this)">🏆<br>السبائك</div>
    <div class="nav-item" onclick="showTab('calc-page', this)">🧮<br>الحاسبة</div>
</div>

<script>
    // وظيفة التنقل البرمجية
    function showTab(pageId, element) {
        document.querySelectorAll('.page-section').forEach(section => section.classList.remove('active-page'));
        document.getElementById(pageId).classList.add('active-page');
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        element.classList.add('active');
        window.scrollTo(0, 0); // للبدء من أعلى الصفحة دائماً
    }

    // جلب البيانات (كودك الأصلي المعدل ليعرض كل شيء)
    async function fetchData() {
        try {
            const response = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT');
            const data = await response.json();
            const globalGold = parseFloat(data.price);
            
            // قيم افتراضية للتوضيح (يمكنك ربطها بـ Firebase الخاص بك)
            const usdRate = 48.50; 
            const p24 = (globalGold / 31.1035) * usdRate;

            document.getElementById('p24').innerText = Math.round(p24).toLocaleString();
            document.getElementById('p21').innerText = Math.round(p24 * 0.875).toLocaleString();
            document.getElementById('p18').innerText = Math.round(p24 * 0.75).toLocaleString();
            
            document.getElementById('global-oz').innerText = globalGold.toFixed(2);
            document.getElementById('bank-dollar').innerText = usdRate.toFixed(2);
            document.getElementById('gold-dollar').innerText = (usdRate + 1.5).toFixed(2); // مثال لفرق الصاغة

            window.currentP24 = p24;
        } catch (error) {
            console.error("خطأ في جلب البيانات");
        }
    }

    function calcBullion(comp, fee) {
        const weight = parseFloat(document.getElementById('b-weight').value);
        if(window.currentP24) {
            const total = (window.currentP24 + fee) * weight;
            document.getElementById('b-total').innerText = Math.round(total).toLocaleString();
            document.getElementById('bullion-result').style.display = 'block';
        }
    }

    function calculateGold() {
        const w = parseFloat(document.getElementById('user-weight').value);
        const c = document.getElementById('user-carat').value;
        let price = window.currentP24;
        if(c == "21") price *= 0.875;
        if(c == "18") price *= 0.75;
        
        const total = w * price;
        document.getElementById('res-val').innerText = Math.round(total).toLocaleString();
        document.getElementById('res-zakat').innerText = (total >= 100000) ? Math.round(total * 0.025).toLocaleString() : "لا تجب (أقل من النصاب)";
        document.getElementById('calc-res').style.display = 'block';
    }

    fetchData();
    setInterval(fetchData, 60000);
</script>

</body>
</html>
