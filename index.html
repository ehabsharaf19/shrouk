<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إيموشا - EMOSHA</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        .container { max-width: 800px; margin: auto; padding: 20px; text-align: center; }
        .logo { font-size: 35px; color: #f1c40f; margin: 20px 0; }
        .post { background: #111; border: 1px solid #f1c40f; border-radius: 15px; padding: 20px; margin-bottom: 30px; text-align: right; }
        .post img { width: 100%; border-radius: 10px; margin-bottom: 15px; }
        .post h2 { color: #f1c40f; margin-top: 0; }
        .post p { line-height: 1.8; color: #eee; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">إيموشا ⚓</div>
        <p>بوصلة الاستثمار في الذهب</p>
        <hr style="border: 1px solid #f1c40f; margin-bottom: 30px;">
        <div id="posts-container">
            </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCp-m2DkIIwIoKUeuntHLvDbEclB041pz4",
            authDomain: "shrouk-ehab.firebaseapp.com",
            projectId: "shrouk-ehab"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        db.collection("posts").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            const container = document.getElementById('posts-container');
            container.innerHTML = "";
            snapshot.forEach((doc) => {
                const post = doc.data();
                container.innerHTML += `
                    <div class="post">
                        ${post.image ? `<img src="${post.image}">` : ""}
                        <h2>${post.title}</h2>
                        <p>${post.content}</p>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
