        function fetchBloggerPosts() {
            const script = document.createElement('script');
            // تم الربط بمدونتك مباشرة emosh20.blogspot.com
            script.src = `https://emosh20.blogspot.com/feeds/posts/default?alt=json-in-script&callback=handlePosts`;
            document.body.appendChild(script);
        }

        window.handlePosts = function(data) {
            const container = document.getElementById('posts-container');
            container.innerHTML = "";
            const entries = data.feed.entry || [];
            
            entries.slice(0, 5).forEach(entry => {
                const title = entry.title.$t;
                const content = entry.content ? entry.content.$t : entry.summary.$t;
                
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = content;
                const firstImg = tempDiv.querySelector('img');
                const imgUrl = firstImg ? firstImg.src : "";
                const textOnly = tempDiv.innerText.replace(/\s+/g, ' ').trim().substring(0, 180) + "...";

                container.innerHTML += `
                    <div class="article-card">
                        ${imgUrl ? `<img src="${imgUrl}" class="article-img">` : ""}
                        <div class="article-title">${title}</div>
                        <p class="article-excerpt">${textOnly}</p>
                    </div>
                `;
            });
        };
        fetchBloggerPosts();
