<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة القبطان إيهاب - EMOSHA</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .box { background: #111; padding: 20px; border-radius: 15px; border: 1px solid #f1c40f; max-width: 400px; margin: auto; }
        input, textarea { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #333; background: #000; color: #fff; }
        button { width: 95%; padding: 12px; background: #f1c40f; color: #000; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top:10px; }
    </style>
</head>
<body>
    <h2>لوحة تحكم إيموشا ⚓</h2>
    <div id="login-section" class="box">
        <input type="email" id="email" placeholder="البريد">
        <input type="password" id="password" placeholder="الباسورد">
        <button onclick="login()">دخول القبطان</button>
    </div>
    <div id="editor-section" class="box" style="display:none;">
        <input type="text" id="post-title" placeholder="عنوان المقال">
        <input type="text" id="post-image-url" placeholder="ضع رابط الصورة هنا">
        <p style="font-size: 12px; color: #aaa;">ارفع صورتك على (postimages.org) وانسخ الرابط المباشر هنا</p>
        <textarea id="post-content" rows="5" placeholder="تفاصيل التحليل..."></textarea>
        <button id="btn-publish" onclick="publishPost()">نشر المقال الآن ✅</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCp-m2DkIIwIoKUeuntHLvDbEclB041pz4",
            authDomain: "shrouk-ehab.firebaseapp.com",
            projectId: "shrouk-ehab"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.login = async () => {
            try { await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); }
            catch (e) { alert("خطأ: " + e.message); }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) { document.getElementById('login-section').style.display = 'none'; document.getElementById('editor-section').style.display = 'block'; }
        });

        window.publishPost = async function() {
            const btn = document.getElementById('btn-publish');
            const title = document.getElementById('post-title').value;
            const content = document.getElementById('post-content').value;
            const imageUrl = document.getElementById('post-image-url').value;

            if(!title || !content) return alert("اكتب العنوان والمحتوى!");

            btn.innerText = "جاري الحفظ...";
            btn.disabled = true;

            try {
                await addDoc(collection(db, "posts"), {
                    title: title,
                    content: content,
                    image: imageUrl,
                    timestamp: serverTimestamp()
                });
                alert("✅ مبروك يا قبطان! المقال ظهر على الموقع");
                location.reload();
            } catch (e) {
                alert("فشل النشر: " + e.message);
                btn.disabled = false;
                btn.innerText = "نشر المقال الآن ✅";
            }
        };
    </script>
</body>
</html>
