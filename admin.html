<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - نشر الأخبار</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .post-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        .btn-send { background: #d4af37; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-size: 18px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .btn-send:hover { background: #b8962e; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="post-card">
        <h2>📝 انشر تحليلاً جديداً</h2>
        <div class="input-group">
            <input type="text" placeholder="عنوان المنشور الاقتصادي...">
        </div>
        <div class="input-group">
            <textarea rows="5" placeholder="اكتب رؤيتك لحركة الذهب والعملات هنا..."></textarea>
        </div>
        <button class="btn-send">نشر المنشور الآن</button>
    </div>
</body>
</html>
