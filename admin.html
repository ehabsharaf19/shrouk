<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم إيموشا - EMOSHA</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
        .admin-box { background: #222; padding: 20px; border-radius: 10px; max-width: 500px; margin: auto; border: 1px solid #f1c40f; }
        input, textarea { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        button { background: #f1c40f; color: #000; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .post-card { background: #333; margin-top: 10px; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>لوحة تحكم القبطان إيهاب ⚓</h2>
    
    <div id="login-section" class="admin-box">
        <h3>تسجيل الدخول</h3>
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="login()">دخول</button>
    </div>

    <div id="editor-section" class="admin-box" style="display:none;">
        <h3>نشر مقال جديد</h3>
        <input type="text" id="post-title" placeholder="عنوان المقال">
        <textarea id="post-content" rows="5" placeholder="اكتب تفاصيل المقال هنا..."></textarea>
        <button onclick="publishPost()">نشر الآن</button>
        <hr>
        <div id="my-posts"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // الـ Config الخاص بك
        const firebaseConfig = {
            apiKey: "AIzaSyCp-m2DkIIwIoKUeuntHLvDbEclB041pz4",
            authDomain: "shrouk-ehab.firebaseapp.com",
            projectId: "shrouk-ehab",
            storageBucket: "shrouk-ehab.firebasestorage.app",
            messagingSenderId: "1015714183835",
            appId: "1:1015714183835:web:ca1a44d98bb9224ff7643e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // وظيفة تسجيل الدخول
        window.login = async function() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                alert("أهلاً بك يا قبطان");
            } catch (e) {
                alert("خطأ في البيانات!");
            }
        };

        // مراقبة حالة المستخدم
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('editor-section').style.display = 'block';
            }
        });

        // وظيفة النشر
        window.publishPost = async function() {
            const title = document.getElementById('post-title').value;
            const content = document.getElementById('post-content').value;
            if(title && content) {
                await addDoc(collection(db, "posts"), {
                    title: title,
                    content: content,
                    date: new Date()
                });
                alert("تم النشر بنجاح!");
                location.reload();
            }
        };
    </script>
</body>
</html>
