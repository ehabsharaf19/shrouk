<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة إيموشا المحمية ⚓</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 15px; text-align: center; }
        .top-nav { max-width: 600px; margin: 0 auto 15px auto; text-align: right; }
        .top-nav a { color: #f1c40f; text-decoration: none; font-weight: bold; font-size: 14px; }
        
        .box { background: #111; padding: 20px; border-radius: 12px; border: 1px solid #f1c40f; max-width: 600px; margin: auto; text-align: right; }
        
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #333; background: #000; color: #fff; text-align: right; font-size: 14px; }
        
        .main-btn { width: 100%; padding: 12px; background: #f1c40f; color: #000; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; margin-top: 10px; }
        .main-btn:hover { background: #d4ac0d; }
        
        .cancel-btn { background: #444; color: #fff; width: 100%; padding: 10px; border: none; border-radius: 6px; cursor: pointer; margin-top: 5px; font-weight: bold; }
        .logout-btn { background: #e74c3c; color: #fff; margin-top: 25px; font-size: 13px; width: auto; padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; display: inline-block; }
        
        /* تصميم روابط المقالات المرتبة بدقة في لوحة التحكم */
        .posts-container { margin-top: 20px; border-top: 1px solid #333; padding-top: 15px; }
        .post-item-row { background: #1a1a1a; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .post-title-link { color: #f1c40f; text-decoration: none; font-size: 14px; font-weight: bold; cursor: pointer; flex: 1; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-left: 10px; }
        .post-title-link:hover { text-decoration: underline; }
        
        .actions-group { display: flex; gap: 5px; flex-shrink: 0; }
        .action-btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .edit-action { background: #f1c40f; color: #000; }
        .delete-action { background: #e74c3c; color: #fff; }
        
        .more-btn { background: #222; color: #f1c40f; border: 1px dashed #f1c40f; width: 100%; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        
        /* التحكم في إظهار وإخفاء الحماية واللوحة */
        #admin-auth-box { display: block; }
        #admin-dashboard { display: none; }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html">⬅ العودة للموقع الرئيسي</a>
    </div>

    <!-- صندوق تسجيل الدخول (حماية صارمة) -->
    <div id="admin-auth-box" class="box" style="text-align: center;">
        <h3 style="color: #f1c40f; margin-top: 0;">تسجيل دخول لوحة التحكم ⚓</h3>
        <p style="color: #888; font-size: 13px;">يرجى إدخال البريد الإلكتروني وكلمة المرور للمتابعة</p>
        <input type="email" id="auth-email" placeholder="البريد الإلكتروني" style="text-align: center;">
        <input type="password" id="auth-password" placeholder="كلمة المرور" style="text-align: center;">
        <button class="main-btn" onclick="executeLogin()">دخول للوحة التحكم</button>
    </div>

    <!-- لوحة التحكم الفعلية (تظهر بعد الباسورد فقط) -->
    <div id="admin-dashboard" class="box">
        <h3 id="panel-main-title" style="color: #f1c40f; text-align: center; margin-top: 0;">إدارة ونشر مقالات EMOSHA</h3>
        
        <input type="hidden" id="current-edit-id">
        <input type="text" id="post-title" placeholder="عنوان المقال">
        <input type="text" id="post-image" placeholder="رابط الصورة (اختياري)">
        <textarea id="post-content" rows="5" placeholder="اكتب التحليل هنا يا إيهاب..."></textarea>
        
        <button id="publish-btn" class="main-btn" onclick="saveOrUpdatePost()">نشر الآن ✅</button>
        <button id="cancel-edit-btn" class="cancel-btn" style="display: none;" onclick="clearForm()">إلغاء التعديل</button>

        <div class="posts-container">
            <h4 style="color: #f1c40f; margin-bottom: 10px;">المقالات الحالية (تعديل / حذف):</h4>
            <div id="admin-posts-list">
                <p style="color: #888; text-align: center;">جاري التحميل...</p>
            </div>
            <button id="load-more-btn" class="more-btn" style="display: none;" onclick="loadMorePosts()">عرض المزيد من المقالات ⬇</button>
        </div>

        <div style="text-align: center;">
            <button class="logout-btn" onclick="executeLogout()">تسجيل خروج وتأمين اللوحة 🔒</button>
        </div>
    </div>

    <!-- مكتبات فايربيس (إصدار 8 المتوافق) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCp-m2DkIIwIoKUeuntHLvDbEclB041pz4",
            authDomain: "shrouk-ehab.firebaseapp.com",
            databaseURL: "https://shrouk-ehab-default-rtdb.firebaseio.com/",
            projectId: "shrouk-ehab",
            storageBucket: "shrouk-ehab.firebasestorage.app",
            messagingSenderId: "1015714183835",
            appId: "1:1015714183835:web:3d5e2b0f60e781e3f7643e"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const auth = firebase.auth();
        const database = firebase.database();

        let allPostsArray = [];
        let visibleCount = 5; // عرض 5 مقالات كبداية لترتيب الصفحة

        // مراقبة حالة الأمان وتسجيل الدخول
        auth.onAuthStateChanged((user) => {
            const authBox = document.getElementById('admin-auth-box');
            const dashboardBox = document.getElementById('admin-dashboard');

            if (user) {
                authBox.style.display = 'none';
                dashboardBox.style.display = 'block';
                fetchAdminPosts();
            } else {
                dashboardBox.style.display = 'none';
                authBox.style.display = 'block';
            }
        });

        // دالة تسجيل الدخول
        window.executeLogin = function() {
            const email = document.getElementById('auth-email').value.trim();
            const pass = document.getElementById('auth-password').value.trim();

            if (!email || !pass) {
                alert("يرجى إدخال البريد الإلكتروني وكلمة المرور!");
                return;
            }

            auth.signInWithEmailAndPassword(email, pass).catch((error) => {
                alert("خطأ في بيانات الدخول! تأكد من الإيميل وكلمة السر.");
                console.error(error);
            });
        };

        // تسجيل الخروج
        window.executeLogout = function() {
            auth.signOut().then(() => {
                location.reload();
            });
        };

        // جلب المقالات
        function fetchAdminPosts() {
            const listEl = document.getElementById('admin-posts-list');
            listEl.innerHTML = "<p style='color: #888; text-align: center;'>جاري التحميل...</p>";

            database.ref('posts').once('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    listEl.innerHTML = "<p style='color: #888; text-align: center;'>لا توجد مقالات منشورة حالياً.</p>";
                    document.getElementById('load-more-btn').style.display = 'none';
                    return;
                }

                allPostsArray = Object.keys(data).map(id => ({
                    id: id,
                    ...data[id]
                })).reverse(); // الأحدث أولاً

                renderPostsList();
            });
        }

        // رسم المقالات (روابط مختصرة + زر تعديل + زر حذف)
        function renderPostsList() {
            const listEl = document.getElementById('admin-posts-list');
            listEl.innerHTML = "";

            const chunk = allPostsArray.slice(0, visibleCount);

            chunk.forEach(post => {
                const cleanTitle = (post.title || "").replace(/'/g, "\\'");
                const cleanImage = (post.image || "").replace(/'/g, "\\'");
                const cleanContent = (post.content || "").replace(/`/g, "\\`").replace(/'/g, "\\'");

                listEl.innerHTML += `
                    <div class="post-item-row">
                        <span class="post-title-link" onclick="setupEditForm('${post.id}', '${cleanTitle}', '${cleanImage}', \`${cleanContent}\`)" title="اضغط لتعديل المقال">${post.title}</span>
                        <div class="actions-group">
                            <button class="action-btn edit-action" onclick="setupEditForm('${post.id}', '${cleanTitle}', '${cleanImage}', \`${cleanContent}\`)">تعديل</button>
                            <button class="action-btn delete-action" onclick="deleteSpecificPost('${post.id}')">حذف</button>
                        </div>
                    </div>
                `;
            });

            const moreBtn = document.getElementById('load-more-btn');
            if (allPostsArray.length > visibleCount) {
                moreBtn.style.display = 'block';
            } else {
                moreBtn.style.display = 'none';
            }
        }

        // زر عرض المزيد
        window.loadMorePosts = function() {
            visibleCount += 5;
            renderPostsList();
        };

        // حفظ أو تعديل مقال
        window.saveOrUpdatePost = function() {
            const title = document.getElementById('post-title').value.trim();
            const content = document.getElementById('post-content').value.trim();
            const image = document.getElementById('post-image').value.trim();
            const editId = document.getElementById('current-edit-id').value;
            const btn = document.getElementById('publish-btn');

            if (!title || !content) {
                alert("يرجى كتابة العنوان والمحتوى أولاً!");
                return;
            }

            btn.innerText = "جاري الحفظ...";
            btn.disabled = true;

            if (editId) {
                database.ref('posts/' + editId).update({ title, content, image }).then(() => {
                    alert("✅ تم تعديل المقال بنجاح!");
                    clearForm();
                    fetchAdminPosts();
                });
            } else {
                database.ref('posts').push({ title, content, image, timestamp: Date.now() }).then(() => {
                    alert("✅ تم نشر المقال بنجاح!");
                    clearForm();
                    fetchAdminPosts();
                });
            }
        };

        // تجهيز النموذج للتعديل
        window.setupEditForm = function(id, title, image, content) {
            document.getElementById('current-edit-id').value = id;
            document.getElementById('post-title').value = title;
            document.getElementById('post-image').value = image;
            document.getElementById('post-content').value = content;

            document.getElementById('panel-main-title').innerText = "تعديل المقال: " + title;
            document.getElementById('publish-btn').innerText = "حفظ التعديلات 💾";
            document.getElementById('cancel-edit-btn').style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // حذف مقال
        window.deleteSpecificPost = function(id) {
            if (confirm("هل أنت متأكد من حذف هذا المقال نهائياً؟")) {
                database.ref('posts/' + id).remove().then(() => {
                    alert("🗑️ تم حذف المقال بنجاح.");
                    fetchAdminPosts();
                });
            }
        };

        // تفريغ النموذج
        window.clearForm = function() {
            document.getElementById('current-edit-id').value = "";
            document.getElementById('post-title').value = "";
            document.getElementById('post-image').value = "";
            document.getElementById('post-content').value = "";
            document.getElementById('panel-main-title').innerText = "إدارة ونشر مقالات EMOSHA";
            document.getElementById('publish-btn').innerText = "نشر الآن ✅";
            document.getElementById('publish-btn').disabled = false;
            document.getElementById('cancel-edit-btn').style.display = "none";
        };
    </script>
</body>
</html>
