<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة القبطان - EMOSHA</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .box { background: #111; padding: 20px; border-radius: 15px; border: 1px solid #f1c40f; max-width: 400px; margin: auto; }
        input, textarea { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #333; background: #000; color: #fff; }
        button { width: 95%; padding: 12px; background: #f1c40f; color: #000; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h2>لوحة تحكم إيموشا ⚓</h2>
    <div class="box">
        <input type="text" id="post-title" placeholder="عنوان المقال">
        <input type="text" id="post-image" placeholder="رابط الصورة (اختياري)">
        <textarea id="post-content" rows="5" placeholder="تفاصيل التحليل..."></textarea>
        <button id="btn-publish" onclick="publishNow()">نشر المقال فوراً ✅</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // الإعدادات مأخوذة مباشرة من صورتك الأخيرة لضمان الربط
        const firebaseConfig = {
            apiKey: "AIzaSyCp-m2DkIIwIoKUeuntHLvDbEclB041pz4",
            authDomain: "shrouk-ehab.firebaseapp.com",
            databaseURL: "https://shrouk-ehab-default-rtdb.firebaseio.com",
            projectId: "shrouk-ehab",
            storageBucket: "shrouk-ehab.appspot.com",
            messagingSenderId: "1015714183835",
            appId: "1:1015714183835:web:ca1a44d98bb9224ff7643e",
            measurementId: "G-FK3KNWZZ15"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function publishNow() {
            const btn = document.getElementById('btn-publish');
            const title = document.getElementById('post-title').value;
            const content = document.getElementById('post-content').value;
            const image = document.getElementById('post-image').value;

            if(!title || !content) return alert("يا قبطان، اكتب العنوان والمحتوى!");

            btn.innerText = "جاري الحفظ في القاعدة...";
            btn.disabled = true;

            db.collection("posts").add({
                title: title,
                content: content,
                image: image,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                alert("✅ تمام يا قبطان إيهاب! المقال نزل على الموقع");
                location.reload();
            })
            .catch((error) => {
                alert("حدث خطأ في الربط: " + error.message);
                btn.disabled = false;
                btn.innerText = "حاول مرة أخرى ✅";
            });
        }
    </script>
</body>
</html>
