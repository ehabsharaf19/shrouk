<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة القبطان إيهاب - EMOSHA</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .box { background: #111; padding: 20px; border-radius: 15px; border: 1px solid #f1c40f; max-width: 400px; margin: auto; }
        input, textarea { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #333; background: #000; color: #fff; }
        button { width: 95%; padding: 12px; background: #f1c40f; color: #000; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top:10px; }
        label { display: block; margin-top: 10px; color: #f1c40f; font-size: 14px; text-align: right; margin-right: 5%; }
    </style>
</head>
<body>

    <h2>لوحة تحكم إيموشا ⚓</h2>

    <div id="login-section" class="box">
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="login()">دخول القبطان</button>
    </div>

    <div id="editor-section" class="box" style="display:none;">
        <input type="text" id="post-title" placeholder="عنوان المقال">
        
        <label>اختر صورة من جهازك:</label>
        <input type="file" id="post-file" accept="image/*">
        
        <textarea id="post-content" rows="5" placeholder="تفاصيل التحليل..."></textarea>
        <button id="btn-publish" onclick="publishPost()">نشر الآن بالصورة</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCp-m2DkIIwIoKUeuntHLvDbEclB041pz4",
            authDomain: "shrouk-ehab.firebaseapp.com",
            projectId: "shrouk-ehab",
            storageBucket: "shrouk-ehab.appspot.com",
            messagingSenderId: "1015714183835",
            appId: "1:1015714183835:web:ca1a44d98bb9224ff7643e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        window.login = async function() {
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
            } catch (e) { alert("خطأ في الدخول: " + e.message); }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('editor-section').style.display = 'block';
            }
        });

        window.publishPost = async function() {
            const btn = document.getElementById('btn-publish');
            const title = document.getElementById('post-title').value;
            const content = document.getElementById('post-content').value;
            const file = document.getElementById('post-file').files[0];

            if(!title || !content) return alert("اكتب العنوان والمحتوى!");

            btn.innerText = "جاري رفع الصورة والنشر...";
            btn.disabled = true;

            let imageUrl = "";

            try {
                // 1. رفع الصورة لو موجودة
                if (file) {
                    const storageRef = ref(storage, 'posts/' + Date.now() + "_" + file.name);
                    const snapshot = await uploadBytes(storageRef, file);
                    imageUrl = await getDownloadURL(snapshot.ref);
                }

                // 2. حفظ المقال في Firestore
                await addDoc(collection(db, "posts"), {
                    title: title,
                    content: content,
                    image: imageUrl,
                    timestamp: serverTimestamp()
                });

                alert("✅ تمام يا قبطان! الصورة والمقال اتنشروا بنجاح");
                location.reload(); 
            } catch (e) { 
                alert("فشل النشر! تأكد من تفعيل Storage و Rules. الخطأ: " + e.message);
                btn.innerText = "نشر الآن بالصورة";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
