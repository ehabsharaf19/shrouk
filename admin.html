<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة القبطان - EMOSHA</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .box { background: #111; padding: 20px; border-radius: 15px; border: 1px solid #f1c40f; max-width: 400px; margin: auto; }
        input, textarea { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #333; background: #000; color: #fff; }
        button { width: 95%; padding: 12px; background: #f1c40f; color: #000; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h2>لوحة تحكم إيموشا ⚓</h2>
    <div id="editor-section" class="box">
        <input type="text" id="post-title" placeholder="عنوان المقال">
        <input type="text" id="post-image" placeholder="رابط الصورة المباشر">
        <textarea id="post-content" rows="5" placeholder="تفاصيل التحليل..."></textarea>
        <button id="btn-publish" onclick="publishPost()">نشر المقال فوراً ✅</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-web.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCp-m2DkIIwIoKUeuntHLvDbEclB041pz4",
            authDomain: "shrouk-ehab.firebaseapp.com",
            projectId: "shrouk-ehab"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.publishPost = async function() {
            const btn = document.getElementById('btn-publish');
            const title = document.getElementById('post-title').value;
            const content = document.getElementById('post-content').value;
            const image = document.getElementById('post-image').value;

            if(!title || !content) return alert("اكتب العنوان والمحتوى!");

            btn.innerText = "برسل للبيانات...";
            btn.disabled = true;

            try {
                await addDoc(collection(db, "posts"), {
                    title: title,
                    content: content,
                    image: image,
                    timestamp: serverTimestamp()
                });
                alert("✅ تمام يا قبطان! المقال اتنشر");
                location.reload();
            } catch (e) {
                alert("فشل النشر: " + e.message);
                btn.disabled = false;
                btn.innerText = "حاول تاني";
            }
        };
    </script>
</body>
</html>
