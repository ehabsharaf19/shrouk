<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة القبطان - EMOSHA</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .box { background: #111; padding: 20px; border-radius: 15px; border: 1px solid #f1c40f; max-width: 400px; margin: auto; }
        input, textarea { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #333; background: #000; color: #fff; display: block; margin-left: auto; margin-right: auto; }
        button { width: 95%; padding: 12px; background: #f1c40f; color: #000; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
    <h2>لوحة تحكم إيموشا ⚓</h2>
    <div class="box">
        <input type="text" id="post-title" placeholder="عنوان المقال">
        <input type="text" id="post-image" placeholder="رابط الصورة المباشر">
        <textarea id="post-content" rows="5" placeholder="تفاصيل التحليل..."></textarea>
        <button id="btn-publish" onclick="publishPost()">نشر المقال فوراً ✅</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // إعدادات مشروعك (تأكد إنها مطابقة تماماً)
        var firebaseConfig = {
            apiKey: "AIzaSyCp-m2DkIIwIoKUeuntHLvDbEclB041pz4",
            authDomain: "shrouk-ehab.firebaseapp.com",
            projectId: "shrouk-ehab"
        };

        // بدء تشغيل فيربيز
        firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();

        async function publishPost() {
            var btn = document.getElementById('btn-publish');
            var title = document.getElementById('post-title').value;
            var content = document.getElementById('post-content').value;
            var image = document.getElementById('post-image').value;

            if(!title || !content) {
                alert("يا قبطان، اكتب العنوان والمحتوى الأول!");
                return;
            }

            btn.innerText = "جاري الإرسال للموقع...";
            btn.disabled = true;

            // إرسال البيانات لـ Firestore
            db.collection("posts").add({
                title: title,
                content: content,
                image: image,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(function() {
                alert("✅ تمام يا قبطان! المقال اتنشر بنجاح");
                window.location.reload();
            })
            .catch(function(error) {
                alert("حصل خطأ: " + error.message);
                btn.disabled = false;
                btn.innerText = "حاول تاني ✅";
            });
        }
    </script>
</body>
</html>
