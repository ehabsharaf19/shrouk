<div id="editor-section" class="admin-box" style="display:none; text-align: right;">
    <h3>نشر مقال جديد بصورة 🖼️</h3>
    <input type="text" id="post-title" placeholder="عنوان المقال الكبير">
    <input type="text" id="post-img" placeholder="رابط صورة المقال (اختياري)">
    <textarea id="post-content" rows="10" placeholder="اكتب المقال التحليلي هنا بالتفصيل..."></textarea>
    <button onclick="publishPost()" style="width: 100%;">نشر الآن واعتماد المقال</button>
    <br><br>
    <button onclick="logout()" style="background: #e74c3c; color: #fff;">تسجيل خروج وتأمين اللوحة</button>
</div>

<script type="module">
    // ... التعريفات السابقة ...
    
    // وظيفة الخروج
    window.logout = async function() {
        await auth.signOut();
        location.reload();
    };

    // وظيفة النشر مع رسالة تأكيد
    window.publishPost = async function() {
        const title = document.getElementById('post-title').value;
        const content = document.getElementById('post-content').value;
        const img = document.getElementById('post-img').value;

        if(title && content) {
            try {
                await addDoc(collection(db, "posts"), {
                    title: title,
                    content: content,
                    image: img || "", // لو مفيش صورة هيسيبها فاضية
                    date: new Date()
                });
                alert("تم النشر بنجاح يا قبطان! مقالك الآن على الموقع.");
                // مسح الخانات بعد النشر
                document.getElementById('post-title').value = "";
                document.getElementById('post-content').value = "";
                document.getElementById('post-img').value = "";
            } catch (e) {
                alert("حدث خطأ في الاتصال: " + e.message);
            }
        } else {
            alert("لازم تكتب العنوان والمحتوى يا قبطان!");
        }
    };
</script>
