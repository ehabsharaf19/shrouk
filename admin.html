<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة إيموشا ⚓</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .box { background: #111; padding: 20px; border-radius: 15px; border: 1px solid #f1c40f; max-width: 600px; margin: auto; text-align: right; box-sizing: border-box; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; text-align: right; }
        button { width: 100%; padding: 12px; background: #f1c40f; color: #000; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .logout-btn { background: #e74c3c; color: #fff; margin-top: 20px; font-size: 12px; width: auto; padding: 8px 20px; }
        .post-row { display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 10px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #333; }
        .btn-action { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; margin-left: 5px; width: auto; }
        .btn-edit { background: #f1c40f; color: #000; }
        .btn-del { background: #e74c3c; color: #fff; }
        #admin-panel { display: none; }
    </style>
</head>
<body>

    <div style="max-width: 600px; margin: 0 auto 15px auto; text-align: right;">
        <a href="index.html" style="color: #f1c40f; text-decoration: none; font-weight: bold;">⬅ العودة للموقع الرئيسي</a>
    </div>

    <!-- نموذج تسجيل الدخول -->
    <div id="login-form" class="box" style="text-align: center;">
        <h3>تسجيل دخول القبطان ⚓</h3>
        <input type="email" id="email" placeholder="البريد الإلكتروني" style="text-align: center;">
        <input type="password" id="password" placeholder="كلمة المرور" style="text-align: center;">
        <button onclick="login()">دخول</button>
    </div>

    <!-- لوحة التحكم وإدارة المقالات -->
    <div id="admin-panel" class="box">
        <h3 id="panel-title" style="color: #f1c40f; text-align: center; margin-top: 0;">إدارة ونشر مقالات EMOSHA</h3>
        
        <input type="hidden" id="edit-post-id">
        <input type="text" id="title" placeholder="عنوان المقال">
        <input type="text" id="image" placeholder="رابط الصورة (اختياري)">
        <textarea id="content" rows="5" placeholder="اكتب التحليل هنا يا إيهاب..."></textarea>
        
        <button id="pub-btn" onclick="savePost()">نشر الآن ✅</button>
        <button id="cancel-edit-btn" style="display:none; background:#444; color:#fff;" onclick="resetForm()">إلغاء التعديل</button>

        <hr style="border:0; border-top:1px solid #333; margin:20px 0;">

        <h4 style="color: #f1c40f; text-align: right; margin-bottom: 10px;">المقالات الحالية (تعديل / حذف):</h4>
        <div id="admin-posts-list" style="max-height: 300px; overflow-y: auto;">
            <p style="color: #888; text-align: center;">جاري تحميل المقالات...</p>
        </div>

        <div style="text-align: center;">
            <button class="logout-btn" onclick="logout()">تسجيل خروج وتأمين اللوحة</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCp-m2DkIIwIoKUeuntHLvDbEclB041pz4",
            authDomain: "shrouk-ehab.firebaseapp.com",
            projectId: "shrouk-ehab",
            storageBucket: "shrouk-ehab.firebasestorage.app",
            messagingSenderId: "1015714183835",
            appId: "1:1015714183835:web:3d5e2b0f60e781e3f7643e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // مراقبة حالة تسجيل الدخول
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                loadAdminPosts();
            } else {
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('admin-panel').style.display = 'none';
            }
        });

        // ربط دالة تسجيل الدخول بنافذة المتصفح لضمان عملها مع الزر
        window.login = async function() {
            const emailInput = document.getElementById('email').value.trim();
            const passwordInput = document.getElementById('password').value.trim();

            if (!emailInput || !passwordInput) {
                alert("يرجى إدخال البريد الإلكتروني وكلمة المرور!");
                return;
            }

            try { 
                await signInWithEmailAndPassword(auth, emailInput, passwordInput); 
            } catch (err) { 
                console.error(err);
                alert("خطأ في بيانات الدخول! تأكد من الإيميل وكلمة السر. (الخطأ: " + err.message + ")"); 
            }
        };

        window.logout = function() { 
            signOut(auth); 
        };

        // دالة جلب وعرض المقالات في لوحة الأدمن مع أزرار التعديل والحذف
        async function loadAdminPosts() {
            const listContainer = document.getElementById('admin-posts-list');
            listContainer.innerHTML = "<p style='color: #888; text-align: center;'>جاري التحميل...</p>";
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                listContainer.innerHTML = "";
                
                if (querySnapshot.empty) {
                    listContainer.innerHTML = "<p style='color: #888; text-align: center;'>لا توجد مقالات منشورة حالياً.</p>";
                    return;
                }

                querySnapshot.forEach((documentSnapshot) => {
                    const post = documentSnapshot.data();
                    const postId = documentSnapshot.id;
                    
                    const safeTitle = (post.title || "").replace(/'/g, "\\'");
                    const safeImage = (post.image || "").replace(/'/g, "\\'");
                    const safeContent = (post.content || "").replace(/`/g, "\\`").replace(/'/g, "\\'");

                    listContainer.innerHTML += `
                        <div class="post-row">
                            <span style="color: #fff; font-size: 14px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-left: 10px; text-align: right;">${post.title}</span>
                            <div>
                                <button class="btn-action btn-edit" onclick="prepareEdit('${postId}', '${safeTitle}', '${safeImage}', \`${safeContent}\`)">تعديل</button>
                                <button class="btn-action btn-del" onclick="deletePost('${postId}')">حذف</button>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error(err);
                listContainer.innerHTML = "<p style='color: #e74c3c; text-align: center;'>خطأ في جلب المقالات.</p>";
            }
        }

        // دالة النشر أو حفظ التعديل
        window.savePost = async function() {
            const t = document.getElementById('title').value;
            const c = document.getElementById('content').value;
            const i = document.getElementById('image').value;
            const editId = document.getElementById('edit-post-id').value;
            const btn = document.getElementById('pub-btn');

            if(!t || !c) return alert("أكمل العنوان والمحتوى أولاً!");

            btn.innerText = "جاري الحفظ...";
            btn.disabled = true;

            try {
                if (editId) {
                    const postRef = doc(db, "posts", editId);
                    await updateDoc(postRef, {
                        title: t,
                        content: c,
                        image: i
                    });
                    alert("✅ تم تعديل المقال بنجاح!");
                } else {
                    await addDoc(collection(db, "posts"), {
                        title: t,
                        content: c,
                        image: i,
                        timestamp: serverTimestamp()
                    });
                    alert("✅ تم نشر المقال بنجاح!");
                }
                resetForm();
                loadAdminPosts();
            } catch (err) {
                console.error(err);
                alert("فشل الحفظ: " + err.message);
                btn.disabled = false;
                btn.innerText = "نشر الآن ✅";
            }
        };

        // تجهيز بيانات المقال للتعديل
        window.prepareEdit = function(id, title, image, content) {
            document.getElementById('edit-post-id').value = id;
            document.getElementById('title').value = title;
            document.getElementById('image').value = image;
            document.getElementById('content').value = content;

            document.getElementById('panel-title').innerText = "تعديل مقال";
            document.getElementById('pub-btn').innerText = "حفظ التعديلات 💾";
            document.getElementById('cancel-edit-btn').style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // حذف مقال
        window.deletePost = async function(id) {
            if (confirm("هل أنت متأكد من حذف هذا المقال نهائياً؟")) {
                try {
                    await deleteDoc(doc(db, "posts", id));
                    alert("🗑️ تم حذف المقال بنجاح.");
                    loadAdminPosts();
                } catch (err) {
                    alert("فشل الحذف: " + err.message);
                }
            }
        };

        // إعادة تعيين النموذج
        window.resetForm = function() {
            document.getElementById('edit-post-id').value = "";
            document.getElementById('title').value = "";
            document.getElementById('image').value = "";
            document.getElementById('content').value = "";
            document.getElementById('panel-title').innerText = "إدارة ونشر مقالات EMOSHA";
            document.getElementById('pub-btn').innerText = "نشر الآن ✅";
            document.getElementById('pub-btn').disabled = false;
            document.getElementById('cancel-edit-btn').style.display = "none";
        };
    </script>
</body>
</html>
