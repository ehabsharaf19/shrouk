<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل المقال... | شروق الذهب</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f1c40f">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- شفرة إعلانات أدسينس -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3563860658939764" crossorigin="anonymous"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5NVYG4VND5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-5NVYG4VND5');
    </script>

    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; line-height: 1.8; margin: 0; padding-bottom: 80px; }
        .post-container { max-width: 800px; margin: 20px auto; background: #111; padding: 25px; border-radius: 15px; border: 1px solid #f1c40f; }
        h1 { color: #f1c40f; text-align: center; font-size: 24px; margin-bottom: 20px; }
        img { width: 100%; max-height: 400px; object-fit: cover; border-radius: 12px; margin: 20px 0; border: 1px solid #333; }
        .content { font-size: 17px; white-space: pre-wrap; text-align: right; color: #ddd; line-height: 1.9; }
        .back-btn { display: inline-block; text-align: center; margin-top: 25px; color: #000; background: #f1c40f; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; }
        
        /* القائمة السفلية */
        .shrouk-bottom-nav { position: fixed !important; bottom: 0 !important; left: 0 !important; width: 100% !important; background: #111 !important; display: flex !important; justify-content: space-around !important; padding: 10px 0 !important; border-top: 2px solid #f1c40f !important; z-index: 9999999 !important; margin: 0 !important; }
        .shrouk-bottom-nav a { color: #fff !important; text-decoration: none !important; text-align: center !important; flex: 1 !important; display: flex !important; flex-direction: column !important; align-items: center !important; font-size: 11px !important; background: #222 !important; margin: 0 4px !important; padding: 8px 0 !important; border-radius: 8px !important; border: 1px solid #444 !important; transition: 0.3s; }
        .shrouk-bottom-nav a i { font-size: 20px !important; margin-bottom: 4px !important; color: #f1c40f !important; }
        .shrouk-bottom-nav a.active { background: #f1c40f !important; color: #000 !important; border-color: #fff !important; }
        .shrouk-bottom-nav a.active i { color: #000 !important; }
    </style>
</head>
<body>

    <div class="post-container" id="single-post">
        <p style="text-align:center; color:#f1c40f;">🕒 جاري تحميل المقال...</p>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { 
            databaseURL: "https://shrouk-ehab-default-rtdb.firebaseio.com/" 
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        if (postId) {
            database.ref('posts/' + postId).once('value').then((snapshot) => {
                const post = snapshot.val();
                if (post) {
                    document.title = post.title + " | شروق الذهب";
                    document.getElementById('single-post').innerHTML = `
                        <h1>${post.title}</h1>
                        ${post.image ? `<img src="${post.image}" alt="${post.title}">` : ""}
                        <div class="content">${post.content}</div>
                        <div style="margin-top:20px; padding-top:15px; border-top:1px solid #333; color:#f1c40f; font-size:14px; text-align:center;">
                           📅 تاريخ النشر: ${post.date ? post.date : new Date(Date.now() - (Math.abs(postId.split('').reduce((a,b)=>a+b.charCodeAt(0),0)) % 60 * 86400000)).toISOString().split('T')[0]} | ✍️ بقلم: إيهاب شرف
                        </div>
                        <div style="text-align:center;">
                            <a href="blog.html" class="back-btn"><i class="fas fa-arrow-right"></i> العودة لقائمة المقالات</a>
                        </div>
                    `;
                } else {
                    document.getElementById('single-post').innerHTML = "<h2 style='text-align:center;'>المقال غير موجود!</h2><div style='text-align:center;'><a href='blog.html' class='back-btn'>العودة للرئيسية</a></div>";
                }
            }).catch(error => {
                console.error(error);
                document.getElementById('single-post').innerHTML = "<p style='text-align:center;'>حدث خطأ أثناء الاتصال بقاعدة البيانات.</p>";
            });
        } else {
            window.location.href = 'blog.html';
        }
    </script>

    <!-- القائمة السفلية الثابتة -->
    <div class="shrouk-bottom-nav">
        <a href="index.html"><i class="fas fa-home"></i><span>الرئيسية</span></a>
        <a href="prices.html"><i class="fas fa-cube"></i><span>السبائك</span></a>
        <a href="blog.html" class="active"><i class="fas fa-newspaper"></i><span>المقالات</span></a>
        <a href="calculator.html"><i class="fas fa-calculator"></i><span>الحاسبة</span></a>
        <a href="zakat.html"><i class="fas fa-mosque"></i><span>الزكاة</span></a>
    </div>

</body>
</html>
