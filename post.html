<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المقال - شروق الذهب</title>
    </head>
<body style="background: #000; color: #fff; font-family: Arial, sans-serif; padding: 20px;">

    <div id="single-post-container" style="max-width: 800px; margin: auto;">
        <p style="text-align:center;">جاري تحميل المقال يا قبطان...</p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        // حط هنا الـ firebaseConfig بتاعك
        const firebaseConfig = { /* بيانات الفايربيز بتاعتك */ };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // كود سحب الـ ID من الرابط وعرض المقال
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        if (postId) {
            database.ref('posts/' + postId).once('value').then((snapshot) => {
                const post = snapshot.val();
                if (post) {
                    document.title = post.title + " - شروق الذهب";
                    document.getElementById('single-post-container').innerHTML = `
                        <h1 style="color:#f1c40f; margin-bottom:20px;">${post.title}</h1>
                        ${post.image ? `<img src="${post.image}" style="width:100%; border-radius:15px; margin-bottom:20px;">` : ""}
                        <div style="line-height:1.9; font-size:18px; white-space:pre-wrap;">${post.content}</div>
                        <hr style="border:0; border-top:1px solid #333; margin:20px 0;">
                        <p style="color:#f1c40f;">🖋️ القبطان إيهاب شرف</p>
                        <a href="blog.html" style="color:#fff; text-decoration:underline;">العودة للمقالات</a>
                    `;
                }
            });
        }
    </script>
</body>
</html>
