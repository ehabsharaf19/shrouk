<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5NVYG4VND5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-5NVYG4VND5');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقالات شروق الذهب - EMOSHA Gold</title>
    <style>
        /* التنسيقات الأصلية كما هي من كود القبطان */
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .main-title { font-size: 35px; font-weight: bold; color: #f1c40f; text-shadow: 0 0 20px rgba(241, 196, 15, 0.7); margin-bottom: 20px; }
        .articles-main { width: 100%; max-width: 800px; }
        .article-item { display: none; border-bottom: 1px solid #333; margin-bottom: 15px; background: #111; border-radius: 12px; overflow: hidden; }
        .article-item.visible { display: block; }
        .article-header { background: #1a1a1a; color: #f1c40f; padding: 18px; cursor: pointer; font-weight: bold; font-size: 18px; border-right: 4px solid transparent; transition: 0.3s; text-align: right; }
        .article-header:hover { border-right-color: #f1c40f; background: #222; }
        .article-content { max-height: 0; padding: 0 15px; color: #ccc; background: #0a0a0a; transition: max-height 0.4s ease-out; overflow: hidden; text-align: right; }
        .article-item.active .article-content { max-height: none; padding: 25px; border-top: 1px solid #333; }
        .article-image { width: 100%; border-radius: 12px; margin-bottom: 15px; }
        .load-more-btn { background: #222; color: #f1c40f; border: 1px solid #f1c40f; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 20px auto; display: none; }
        .back-btn { margin-top: 20px; color: #f1c40f; text-decoration: none; border: 1px solid #444; padding: 10px 20px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="main-title">📰 تحليلات ومقالات شروق الذهب</div>

    <div class="articles-main">
        <div id="posts-container">جاري التحميل...</div>
        <center><button id="load-more-btn" class="load-more-btn" onclick="loadThreeMore()">عرض 3 مقالات أخرى</button></center>
    </div>

    <a href="index.html" class="back-btn">⬅️ العودة للرئيسية</a>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { databaseURL: "https://shrouk-ehab-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        let visibleCount = 3; // رجعناها 3 كما في الأصل
        let allPostsData = []; 

        database.ref('posts').on('value', (snapshot) => {
            const data = snapshot.val();
            if(data) {
                allPostsData = Object.keys(data).map(id => ({ id: id, ...data[id] })).reverse();
                renderPosts();
            }
        });

        function renderPosts() {
            const container = document.getElementById('posts-container');
            container.innerHTML = "";
            allPostsData.forEach((post, index) => {
                const isVisible = index < visibleCount ? 'visible' : '';
                container.innerHTML += `
                    <div class="article-item ${isVisible}">
                        <div class="article-header" onclick="this.parentElement.classList.toggle('active')">${post.title}</div>
                        <div class="article-content">
                            ${post.image ? `<img src="${post.image}" class="article-image">` : ""}
                            <div style="white-space: pre-wrap; line-height: 1.9;">${post.content}</div>
                        </div>
                    </div>`;
            });

            const loadMoreBtn = document.getElementById('load-more-btn');
            loadMoreBtn.style.display = visibleCount < allPostsData.length ? 'block' : 'none';
        }

        function loadThreeMore() {
            visibleCount += 3; // التحميل بالـ 3 كما طلبت
            renderPosts();
        }
    </script>
</body>
</html>
