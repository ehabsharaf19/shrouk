        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }

        .article-header { background: #1a1a1a; color: #f1c40f; padding: 18px; cursor: pointer; font-weight: bold; font-size: 18px; border-right: 4px solid transparent; transition: 0.3s; text-align: right; }
        .article-header:hover { border-right-color: #f1c40f; background: #222; }
        .article-content { max-height: 0; padding: 0 15px; color: #ccc; background: #0a0a0a; transition: max-height 0.4s ease-out; overflow: hidden; text-align: right; }
        .article-item.active .article-content { max-height: none; padding: 25px; border-top: 1px solid #333; }
        .article-image { width: 100%; border-radius: 12px; margin-bottom: 15px; }
        .load-more-btn { background: #222; color: #f1c40f; border: 1px solid #f1c40f; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 20px auto; display: none; }

        .meta-info { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 15px; border-top: 1px solid #222; color: #f1c40f; font-size: 14px; }

<body>

    <center>
        <!-- الهيدر الموحد - شروق الذهب -->
<div style="background: #000; text-align: center; padding: 20px 0; border-bottom: 2px solid #f1c40f;">
    <h1 style="color: #f1c40f; margin: 0; font-size: 24px;">✨ شروق الذهب ✨</h1>

</div>

    <div class="articles-main">
        <h2 style="color: #f1c40f; text-align: right; border-right: 6px solid #f1c40f; padding-right: 15px;">📰 أحدث تحليلات القبطان</h2>
        <div id="posts-container">جاري التحميل...</div>
        <center><button id="load-more-btn" class="load-more-btn" onclick="loadThreeMore()">عرض 3 مقالات أخرى</button></center>
    </div>

    <div class="footer-gold">
        <a href="about.html" style="color:#f1c40f; text-decoration:none; margin:0 10px;">من نحن</a> | 
        <a href="contact.html" style="color:#f1c40f; text-decoration:none; margin:0 10px;">اتصل بنا</a> | 
        <a href="privacy.html" style="color:#f1c40f; text-decoration:none; margin:0 10px;">سياسة الخصوصية</a>
        <p style="margin-top:20px; color:#666; font-size:12px;">جميع الحقوق محفوظة © 2026 | القبطان إيهاب شرف</p>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { databaseURL: "https://shrouk-ehab-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        let visibleCount = 3; 
        let allPostsData = []; 

        database.ref('posts').on('value', (snapshot) => {
            const data = snapshot.val();
            if(data) {
                allPostsData = Object.keys(data).map(id => ({ id: id, ...data[id] })).reverse();
                renderPosts();
            }
        });

        function renderPosts() {
            const container = document.getElementById('posts-container');
            container.innerHTML = "";
            allPostsData.forEach((post, index) => {
                const isVisible = index < visibleCount ? 'visible' : '';
                // جلب التاريخ من البيانات أو وضع تاريخ افتراضي إذا لم يوجد
                const postDate = post.date ? post.date : "2026-05-14"; 

                container.innerHTML += `
                    <div class="article-item ${isVisible}">
                        <div class="article-header">
    <a href="post.html?id=${post.id}" style="color:inherit; text-decoration:none; display:block;">
        ${post.title} 🔗
    </a>
</div>
<div class="article-content">



                            ${post.image ? `<img src="${post.image}" class="article-image">` : ""}
                            <div style="white-space: pre-wrap; line-height: 1.9;">${post.content}</div>
                            <div class="meta-info">
                                <span style="color:#666;">📅 تاريخ النشر: ${postDate}</span>
                                <span>✍️ القبطان إيهاب شرف</span>
                            </div>
                        </div>
                    </div>`;
            });

            const loadMoreBtn = document.getElementById('load-more-btn');
            loadMoreBtn.style.display = visibleCount < allPostsData.length ? 'block' : 'none';
        }

        function loadThreeMore() {
            visibleCount += 3;
            renderPosts();
        }
    </script>
