    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; padding-bottom: 90px !important; }

        .load-more-btn { background: #222; color: #f1c40f; border: 1px solid #f1c40f; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 20px auto; display: none; }

        .shrouk-bottom-nav a.active { background: #f1c40f !important; color: #000 !important; border-color: #fff !important; }

<body>

    <center style="width:100%;">
        <div style="background: #000; text-align: center; padding: 20px 0; border-bottom: 2px solid #f1c40f; width:100%;">
            <h1 style="color: #f1c40f; margin: 0; font-size: 24px;">✨ شروق الذهب ✨</h1>
            <p style="color: #fff; margin: 5px 0 0; font-size: 14px;">إيموشا جولد - Emosha Gold</p>
        </div>
    </center>

    <div class="articles-main">
        <h2 style="color: #f1c40f; text-align: right; border-right: 6px solid #f1c40f; padding-right: 15px;">📰 أحدث تحليلات القبطان</h2>
        <div id="posts-container">
            <div style="color: #888; text-align: center; padding: 20px;">جاري تحميل أحدث المقالات...</div>
        </div>
        <center><button id="load-more-btn" class="load-more-btn" onclick="loadThreeMore()">عرض 3 مقالات أخرى</button></center>
    </div>

    <div class="footer-gold">
        <a href="about.html" style="color:#f1c40f; text-decoration:none; margin:0 10px;">من نحن</a> | 
        <a href="contact.html" style="color:#f1c40f; text-decoration:none; margin:0 10px;">اتصل بنا</a> | 
        <a href="privacy.html" style="color:#f1c40f; text-decoration:none; margin:0 10px;">سياسة الخصوصية</a>
        <p style="margin-top:20px; color:#666; font-size:12px;">جميع الحقوق محفوظة © 2026 | إيهاب شرف</p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { databaseURL: "https://shrouk-ehab-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        let visibleCount = 3; 
        let allPostsData = []; 

        // استخدام once بدلاً من on لجلب البيانات فوراً وبشكل أسرع
        database.ref('posts').once('value').then((snapshot) => {
            const data = snapshot.val();
            if(data) {
                allPostsData = Object.keys(data).map(id => ({ id: id, ...data[id] })).reverse();
                renderPosts();
            } else {
                document.getElementById('posts-container').innerHTML = "<div style='text-align:center;'>لا توجد مقالات حالياً</div>";
            }
        });

        function renderPosts() {
            const container = document.getElementById('posts-container');
            container.innerHTML = "";
            
            allPostsData.forEach((post, index) => {
                const isVisible = index < visibleCount ? 'visible' : '';
                const postDate = post.date ? post.date : "2026-09-19"; 

                container.innerHTML += `
                    <div class="article-item ${isVisible}">
                        <div class="article-header">
                            <a href="post.html?id=${post.id}" style="color:inherit; text-decoration:none; width:100%;">
                                ${post.title} 🔗
                            </a>
                        </div>
                        <div class="article-content">
                            ${post.image ? `<img src="${post.image}" class="article-image" alt="${post.title}">` : ""}
                            <div class="article-excerpt">${post.content}</div>
                            <a href="post.html?id=${post.id}" class="read-btn">اقرأ المقال كاملاً 👈</a>
                            <div class="meta-info">
                                <span>📅 تاريخ النشر: ${postDate}</span>
                                <span>✍️ إيهاب شرف</span>
                            </div>
                        </div>
                    </div>`;
            });

            const loadMoreBtn = document.getElementById('load-more-btn');
            loadMoreBtn.style.display = visibleCount < allPostsData.length ? 'block' : 'none';
        }

        function loadThreeMore() {
            visibleCount += 3;
            renderPosts();
        }
    </script>
