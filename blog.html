    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .articles-main { width: 95%; max-width: 1100px; margin-top: 20px; }
        
        /* تعديل جوهري هنا: المقالات تظهر مباشرة وليست مخفية */
        .article-item { border-bottom: 1px solid #333; margin-bottom: 20px; background: #111; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
        
        .article-header { background: #1a1a1a; color: #f1c40f; padding: 18px; font-weight: bold; font-size: 18px; border-right: 4px solid #f1c40f; text-align: right; }
        .article-content { padding: 25px; color: #ccc; background: #0a0a0a; text-align: right; line-height: 1.9; }
        .article-image { width: 100%; border-radius: 12px; margin-bottom: 15px; }
        
        .load-more-btn { background: #f1c40f; color: #000; border: none; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 20px auto; display: none; font-size: 16px; }
        .footer-gold { background: #000; color: #f1c40f; text-align: center; padding: 45px; border-top: 2px solid #f1c40f; width: 100%; margin-top: 60px; box-sizing: border-box; }
        .meta-info { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 15px; border-top: 1px solid #222; color: #f1c40f; font-size: 14px; }
    </style>

<body>

    <center>
        <!-- الهيدر الموحد - شروق الذهب -->
        <div style="background: #000; text-align: center; padding: 20px 0; border-bottom: 2px solid #f1c40f; width: 100%;">
            <h1 style="color: #f1c40f; margin: 0; font-size: 24px;">✨ شروق الذهب ✨</h1>
            <p style="color: #fff; margin: 5px 0 0; font-size: 14px;">إيموشا جولد - Emosha Gold</p>
        </div>
    </center>

    <div class="articles-main">
        <h2 style="color: #f1c40f; text-align: right; border-right: 6px solid #f1c40f; padding-right: 15px;">📰 أحدث تحليلات القبطان</h2>
        <div id="posts-container">جاري تحميل المقالات...</div>
        <center><button id="load-more-btn" class="load-more-btn" onclick="loadThreeMore()">عرض المزيد من المقالات</button></center>
    </div>

    <div class="footer-gold">
        <a href="about.html" style="color:#f1c40f; text-decoration:none; margin:0 10px;">من نحن</a> | 
        <a href="contact.html" style="color:#f1c40f; text-decoration:none; margin:0 10px;">اتصل بنا</a> | 
        <a href="privacy.html" style="color:#f1c40f; text-decoration:none; margin:0 10px;">سياسة الخصوصية</a>
        <p style="margin-top:20px; color:#666; font-size:12px;">جميع الحقوق محفوظة © 2026 | القبطان إيهاب شرف</p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { databaseURL: "https://shrouk-ehab-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        let visibleCount = 5; // عرض 5 مقالات افتراضياً في صفحة المدونة
        let allPostsData = []; 

        database.ref('posts').on('value', (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('posts-container');
            
            if(data) {
                allPostsData = Object.keys(data).map(id => ({ id: id, ...data[id] })).reverse();
                renderPosts();
            } else {
                container.innerHTML = "<p style='text-align:center; color:#888;'>لا توجد مقالات منشورة حالياً.</p>";
            }
        });

        function renderPosts() {
            const container = document.getElementById('posts-container');
            container.innerHTML = "";
            
            const currentPosts = allPostsData.slice(0, visibleCount);
            
            currentPosts.forEach((post) => {
                const postDate = post.date ? post.date : "2026-05-14"; 

                container.innerHTML += `
                    <div class="article-item">
                        <div class="article-header">
                            <a href="post.html?id=${post.id}" style="color:inherit; text-decoration:none; display:block;">
                                ${post.title} 🔗
                            </a>
                        </div>
                        <div class="article-content">
                            ${post.image ? `<img src="${post.image}" class="article-image">` : ""}
                            <div style="white-space: pre-wrap;">${post.content}</div>
                            <div class="meta-info">
                                <span style="color:#888;">📅 تاريخ النشر: ${postDate}</span>
                                <span>✍️ القبطان إيهاب شرف</span>
                            </div>
                        </div>
                    </div>`;
            });

            const loadMoreBtn = document.getElementById('load-more-btn');
            loadMoreBtn.style.display = visibleCount < allPostsData.length ? 'block' : 'none';
        }

        function loadThreeMore() {
            visibleCount += 5;
            renderPosts();
        }
    </script>
